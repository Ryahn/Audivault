                <label class="form-label">Discarded copies</label>
                <div class="form-check">
                  <input class="form-check-input" type="radio" id="dup-trash" value="trash" x-model="resolving.mode">
                  <label class="form-check-label" for="dup-trash">Move to the trash folder <span class="mono small">.abstream-trash</span> in their library folder (recoverable)</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="radio" id="dup-delete" value="delete" x-model="resolving.mode">
                  <label class="form-check-label" for="dup-delete">Delete permanently</label>
                </div>
                <p class="form-text mb-0 mt-2">Listening progress, bookmarks, collections and playlists of the discarded copies move to the kept copy.</p>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-ghost" :disabled="resolving.busy" @click="resolving = null">Cancel</button>
                <button type="button" :class="resolving.mode === 'delete' ? 'btn btn-danger-solid' : 'btn btn-accent'" :disabled="resolving.busy" @click="resolve()">
                  <span class="spinner-border spinner-border-sm me-1" style="color:inherit" x-show="resolving.busy"></span>
                  <span x-text="resolving.mode === 'delete' ? 'Keep and delete others' : 'Keep and trash others'"></span>
                </button>
              </div>
            </div>
          </div>
        </template>
      </div>
    </template>

    <!-- ============================================================ settings -->
    <template x-if="$store.app.route.name === 'settings'">
      <div class="page" x-data="settingsView()">
        <h1 class="page-title mb-3">Settings</h1>
        <div class="nav-tabs-ui">
          <template x-if="$store.app.isAdmin"><button :class="tab === 'libraries' && 'active'" @click="setTab('libraries')">Libraries</button></template>
          <template x-if="$store.app.isAdmin"><button :class="tab === 'users' && 'active'" @click="setTab('users')">Users</button></template>
          <template x-if="$store.app.isAdmin"><button :class="tab === 'keys' && 'active'" @click="setTab('keys')">API keys</button></template>
          <template x-if="$store.app.isAdmin"><button :class="tab === 'activity' && 'active'" @click="setTab('activity')">Activity</button></template>
          <template x-if="$store.app.isAdmin"><button :class="tab === 'trash' && 'active'" @click="setTab('trash')">Trash</button></template>
          <button :class="tab === 'account' && 'active'" @click="setTab('account')">Account</button>
        </div>

        <!-- libraries -->
        <template x-if="tab === 'libraries' && $store.app.isAdmin">
          <div>
            <div class="d-flex mb-3"><button class="btn btn-accent ms-auto" @click="newLibrary()"><i class="bi bi-plus-lg"></i> New library</button></div>
            <template x-for="lib in $store.app.libraries" :key="lib.id">
              <div class="panel mb-3">
                <div class="panel-head">
                  <div>
                    <div class="fw-semibold"><span x-text="lib.name"></span> <span class="chip chip-lock ms-1" x-show="lib.settings.locked"><i class="bi bi-lock-fill"></i> Locked library</span></div>
                    <div class="small text-muted" x-text="lib.lastScan ? 'Last scan ' + fmt.datetime(lib.lastScan) : 'Never scanned'"></div>
                  </div>
                  <div class="d-flex flex-wrap gap-2">
                    <button class="btn btn-ghost btn-sm" @click="scan(lib, false)"><i class="bi bi-arrow-repeat"></i> Scan</button>
                    <button class="btn btn-ghost btn-sm" @click="refreshMetadata(lib)" title="Fill empty description, genres, narrator, series, and cover. Does not replace metadata that is already set."><i class="bi bi-cloud-download"></i> Refresh metadata</button>
                    <button class="btn btn-ghost btn-sm" @click="scan(lib, true)" title="Re-read all metadata from files (overwrites edits not saved to metadata.json)">Force rescan</button>
                    <button class="btn btn-ghost btn-sm" @click="editLibrary(lib)"><i class="bi bi-pencil"></i> Edit</button>
                    <div class="position-relative" x-data="{ open: false }" @click.outside="open = false">
                      <button class="btn btn-ghost btn-sm btn-icon" @click="open = !open" aria-label="More"><i class="bi bi-three-dots"></i></button>
                      <div class="menu" x-show="open" x-cloak @click="open = false">
                        <button @click="removeMissing(lib)"><i class="bi bi-eraser"></i> Remove missing items</button>
                        <button @click="deleteLibrary(lib)" style="color:var(--danger)"><i class="bi bi-trash"></i> Delete library</button>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="panel-body small">
                  <div class="meta-grid">
                    <dt>Folders</dt><dd><template x-for="f in lib.folders" :key="f.id"><div class="mono"><span x-text="f.fullPath"></span>
                      <span class="chip chip-lock ms-1" x-show="f.locked || lib.settings.locked"><i class="bi bi-lock-fill"></i> locked</span></div></template></dd>
                    <dt>Import folder</dt><dd class="mono" x-text="lib.settings.importFolder || '—'"></dd>
                    <dt>Template</dt><dd class="mono" x-text="lib.settings.namingTemplate"></dd>
                    <dt>Provider</dt><dd x-text="lib.settings.metadataProvider"></dd>
                  </div>
                </div>
              </div>
            </template>
          </div>
        </template>

        <!-- users -->
        <template x-if="tab === 'users' && $store.app.isAdmin">
          <div>
            <div class="d-flex mb-3"><button class="btn btn-accent ms-auto" @click="newUser()"><i class="bi bi-person-plus"></i> New user</button></div>
            <div class="panel table-responsive">
              <table class="table table-dark-ui">
                <thead><tr><th>User</th><th>Type</th><th class="d-none d-md-table-cell">Last seen</th><th>Status</th><th></th></tr></thead>
                <tbody>
                  <template x-for="u in users" :key="u.id">
                    <tr>
                      <td class="fw-semibold" x-text="u.username"></td>
                      <td><span class="chip" :class="['root','admin'].includes(u.type) && 'chip-accent'" x-text="u.type"></span></td>
                      <td class="d-none d-md-table-cell text-muted" x-text="fmt.datetime(u.lastSeen) || 'Never'"></td>
                      <td><span class="small fw-semibold" :class="u.isActive ? 'status-ok' : 'status-error'" x-text="u.isActive ? 'Active' : 'Disabled'"></span></td>
                      <td class="text-end text-nowrap">
                        <button class="btn btn-ghost btn-sm" @click="editUser(u)" x-show="u.type !== 'root' || $store.app.user.type === 'root'">Edit</button>
                        <button class="btn btn-danger-soft btn-sm" @click="deleteUser(u)" x-show="u.type !== 'root' && u.id !== $store.app.user.id">Delete</button>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>
        </template>

        <!-- api keys -->
        <template x-if="tab === 'keys' && $store.app.isAdmin">
          <div>
            <p class="text-muted">API keys let apps and scripts sign in without a password (AudioBooth supports this). Each key acts as the user it belongs to. Send it as <span class="mono">Authorization: Bearer &lt;key&gt;</span>. The <a href="/api-docs" target="_blank" rel="noopener">API reference</a> lists every route, and <a href="/openapi.json" target="_blank" rel="noopener">openapi.json</a> is the same document for other tools.</p>
            <template x-if="newKey">
              <div class="panel mb-3" style="border-color:var(--accent)"><div class="panel-body">
                <div class="fw-semibold mb-2">Copy this key now. It will not be shown again.</div>
                <div class="d-flex gap-2"><input class="form-control mono" readonly :value="newKey" @focus="$event.target.select()"><button class="btn btn-accent" @click="copy(newKey)">Copy</button></div>
              </div></div>
            </template>
            <div class="d-flex mb-3"><button class="btn btn-accent ms-auto" @click="keyForm = { name: '', userId: $store.app.user.id, days: '' }; newKey = null"><i class="bi bi-key"></i> New API key</button></div>
            <template x-if="keyForm">
              <form class="panel mb-3" @submit.prevent="createKey()"><div class="panel-body row g-2 align-items-end">
                <div class="col-md-4"><label class="form-label">Name</label><input class="form-control" x-model="keyForm.name" required placeholder="e.g. iPhone"></div>
                <div class="col-md-4"><label class="form-label">User</label><select class="form-select" x-model="keyForm.userId"><template x-for="u in users" :key="u.id"><option :value="u.id" x-text="u.username" :selected="u.id === keyForm.userId"></option></template></select></div>
                <div class="col-md-2"><label class="form-label">Expires (days)</label><input class="form-control" type="number" min="0" x-model="keyForm.days" placeholder="Never"></div>
                <div class="col-md-2 d-grid"><button class="btn btn-accent">Create</button></div>
              </div></form>
            </template>
            <div class="panel table-responsive">
              <table class="table table-dark-ui">
                <thead><tr><th>Name</th><th>User</th><th class="d-none d-md-table-cell">Created</th><th class="d-none d-md-table-cell">Last used</th><th>Expires</th><th></th></tr></thead>
                <tbody>
                  <template x-for="k in keys" :key="k.id">
                    <tr>
                      <td class="fw-semibold" x-text="k.name"></td><td x-text="k.user ? k.user.username : '?'"></td>
                      <td class="d-none d-md-table-cell text-muted" x-text="fmt.date(k.createdAt)"></td>
                      <td class="d-none d-md-table-cell text-muted" x-text="fmt.datetime(k.lastUsedAt) || 'Never'"></td>
                      <td class="text-muted" x-text="k.expiresAt ? fmt.date(k.expiresAt) : 'Never'"></td>
                      <td class="text-end"><button class="btn btn-danger-soft btn-sm" @click="deleteKey(k)">Revoke</button></td>
                    </tr>
                  </template>
                </tbody>
              </table>
              <div class="p-3 text-muted" x-show="!keys.length">No API keys.</div>
            </div>
          </div>
        </template>

        <!-- activity -->
        <template x-if="tab === 'activity' && $store.app.isAdmin">
          <div class="row g-3">
            <div class="col-lg-5">
              <div class="panel mb-3"><div class="panel-head"><h2 class="section-title">Live updates</h2>
                  <span class="small fw-semibold" :class="$store.app.eventsConnected ? 'status-ok' : 'status-error'" x-text="$store.app.eventsConnected ? 'Connected' : 'Reconnecting…'"></span></div>
                <div class="panel-body small">
                  <div class="form-label">Watched folders</div>
                  <template x-for="w in watching" :key="w.path + w.mode">
                    <div class="d-flex gap-2 py-1" style="border-bottom:1px solid var(--border)">
                      <span class="chip" x-text="w.target"></span><span class="mono flex-grow-1 text-truncate" x-text="w.path"></span><span class="text-muted" x-text="w.mode"></span>
                    </div>
                  </template>
                  <div class="text-muted" x-show="!watching.length">No folders are being watched.</div>
                </div>
              </div>
              <div class="panel"><div class="panel-head"><h2 class="section-title">Tasks</h2></div><div class="panel-body">
                <template x-for="t in $store.app.tasks" :key="t.id">
                  <div class="task-row">
                    <i class="bi" :class="{ 'bi-hourglass-split': t.status === 'running', 'bi-check-circle status-ok': t.status === 'done', 'bi-x-circle status-error': t.status === 'failed' }"></i>
                    <div class="flex-grow-1 min-w-0">
                      <div class="fw-semibold" x-text="t.title"></div>
                      <div class="small text-muted text-truncate" x-text="t.status === 'running' ? `${t.progress}/${t.total} ${t.message}` : (t.error || fmt.datetime(t.finished_at))"></div>
                      <div class="bar mt-1" x-show="t.status === 'running' && t.total"><span :style="`width:${t.total ? t.progress / t.total * 100 : 0}%`"></span></div>
                    </div>
                  </div>
                </template>
                <div class="text-muted" x-show="!$store.app.tasks.length">No recent tasks.</div>
              </div></div>
            </div>
            <div class="col-lg-7">
              <div class="panel"><div class="panel-head"><h2 class="section-title">Activity log</h2><button class="btn btn-ghost btn-sm" @click="loadTab()"><i class="bi bi-arrow-clockwise"></i></button></div>
                <div class="panel-body small" style="max-height:60vh;overflow-y:auto">
                  <template x-for="(a, idx) in activity" :key="idx">
                    <div class="d-flex gap-3 py-1" style="border-bottom:1px solid var(--border)">
                      <span class="mono text-muted text-nowrap" x-text="new Date(a.time).toLocaleTimeString()"></span>
                      <span :class="{ 'status-error': a.level === 'error' }" :style="a.level === 'warning' ? 'color:var(--warning)' : ''" x-text="a.message"></span>
                    </div>
                  </template>
                  <div class="text-muted" x-show="!activity.length">Nothing yet.</div>
                </div>
              </div>
            </div>
          </div>
        </template>

        <!-- trash -->
        <template x-if="tab === 'trash' && $store.app.isAdmin">
          <div>
            <div class="panel mb-3"><div class="panel-body">
              <div class="row g-3 align-items-end">
                <div class="col-md-7">
                  <label class="form-label" for="trash-days">Empty trash after</label>
                  <div class="d-flex gap-2 align-items-center">
                    <input class="form-control" id="trash-days" type="number" min="0" style="max-width:120px" x-model.number="trashDays" :disabled="trash.lockedByEnv">
                    <span>days</span>
                    <button type="button" class="btn btn-accent btn-sm" x-show="!trash.lockedByEnv" :disabled="trashDays === trash.retentionDays" @click="saveTrashDays()">Save</button>
                  </div>
                  <div class="form-text" x-show="!trash.lockedByEnv">0 keeps the trash forever. Old trash is checked hourly.</div>
                  <div class="form-text" x-show="trash.lockedByEnv"><i class="bi bi-lock"></i> Set by <span class="mono">ABSTREAM_TRASH_DAYS</span> (<span class="mono">TRASH_DAYS</span> in Docker Compose). Clear it there to manage this here.</div>
                </div>
                <div class="col-md-5 text-md-end">
                  <div class="small text-muted mb-1" x-text="trashSummary()"></div>
                  <button type="button" class="btn btn-danger-soft btn-sm" :disabled="!trash.entries.length" @click="emptyTrash()"><i class="bi bi-trash3"></i> Empty trash now</button>
                </div>
              </div>
            </div></div>
            <p class="text-muted small">Copies discarded in the duplicate manager are kept in a <span class="mono">.abstream-trash</span> folder inside their library folder until the trash is emptied.</p>
            <div class="py-4 text-center" x-show="trashLoading"><div class="spinner-border" role="status"><span class="visually-hidden">Loading</span></div></div>
            <template x-if="!trashLoading && !trashError && !trash.entries.length">
              <div class="empty"><i class="bi bi-trash"></i>The trash is empty.</div>
            </template>
            <template x-for="e in trash.entries" :key="e.folderId + e.batch">
              <div class="panel mb-3" x-show="!trashLoading">
                <div class="panel-head">
                  <div class="min-w-0">
                    <div class="fw-semibold" x-text="'Discarded ' + fmt.datetime(e.deletedAt)"></div>
                    <div class="small text-muted">
                      <span class="mono" x-text="e.folderPath"></span> ·
                      <span x-text="fmt.size(e.size)"></span> ·
                      <span x-text="e.locked ? 'kept: the folder is locked' : (e.expiresAt ? 'deleted for good ' + untilText(e.expiresAt) : 'kept until you empty the trash')"></span>
                    </div>
                  </div>
                  <button type="button" class="btn btn-danger-soft btn-sm" x-show="!e.locked" @click="deleteTrash(e)"><i class="bi bi-x-lg"></i> Delete now</button>
                  <span class="chip chip-lock" x-show="e.locked" :title="e.lockReason"><i class="bi bi-lock-fill"></i> Locked folder</span>
                </div>
                <div class="panel-body p-0">
                  <table class="table table-dark-ui">
                    <tbody>
                      <template x-for="b in e.books" :key="b.relPath">
                        <tr>
                          <td class="mono small" x-text="b.relPath"></td>
                          <td class="text-end small text-muted text-nowrap" x-text="fmt.size(b.size)"></td>
                          <td class="text-end text-nowrap" style="width:1%">
                            <button type="button" class="btn btn-ghost btn-sm" @click="restoreTrash(e, b)"><i class="bi bi-arrow-counterclockwise"></i> Restore</button>
                            <button type="button" class="btn btn-ghost btn-sm btn-icon" x-show="!e.locked" @click="deleteTrash(e, b)" :aria-label="'Delete ' + b.relPath"><i class="bi bi-trash3"></i></button>
                          </td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </div>
            </template>
          </div>
        </template>

        <!-- account -->
        <template x-if="tab === 'account'">
          <div class="row g-3">
            <div class="col-lg-6">
              <form class="panel" @submit.prevent="changePassword()"><div class="panel-head"><h2 class="section-title">Change password</h2></div><div class="panel-body">
                <div class="mb-2"><label class="form-label">Current password</label><input class="form-control" type="password" x-model="pw.password" autocomplete="current-password"></div>
                <div class="mb-3"><label class="form-label">New password</label><input class="form-control" type="password" x-model="pw.newPassword" autocomplete="new-password"></div>
                <button class="btn btn-accent">Update password</button>
              </div></form>
            </div>
            <div class="col-lg-6">
              <div class="panel"><div class="panel-head"><h2 class="section-title">Connecting apps</h2></div><div class="panel-body">
                <p class="mb-2">Apps built for Audiobookshelf (such as AudioBooth) can connect to this server. Use this address as the server URL:</p>
                <div class="d-flex gap-2"><input class="form-control mono" readonly :value="location.origin"><button class="btn btn-ghost" @click="copy(location.origin)">Copy</button></div>
                <p class="mt-3 mb-0 text-muted small">Sign in with your username and password, or with an API key from an administrator.</p>
              </div></div>
            </div>
          </div>
        </template>

        <!-- library editor -->
        <template x-if="editingLib">
          <div class="ui-modal">
            <div class="backdrop" @click="editingLib = null"></div>
            <form class="modal-content" @submit.prevent="saveLibrary()">
              <div class="modal-header"><h2 class="h5 m-0" x-text="editingLib.id ? 'Edit library' : 'New library'"></h2><button type="button" class="btn-close" data-dismiss @click="editingLib = null" aria-label="Close"></button></div>
              <div class="modal-body">
                <div class="mb-3"><label class="form-label">Name</label><input class="form-control" x-model="editingLib.name" required placeholder="Audiobooks"></div>
                <div class="form-check form-switch mb-3">
                  <input class="form-check-input" type="checkbox" id="tg-locked" x-model="editingLib.settings.locked">
                  <label class="form-check-label" for="tg-locked"><i class="bi bi-lock-fill" style="color:var(--warning)"></i> Lock the whole library (source of truth)
                    <span class="d-block small text-muted">Nothing in any of its folders is ever deleted or overwritten: no "delete files", no discarding duplicates, no emptying trash, no replacing files. Renaming, organizing and metadata edits still work.</span></label>
                </div>
                <label class="form-label">Library folders</label>
                <template x-for="(f, idx) in editingLib.folders" :key="f.fullPath">
                  <div class="d-flex gap-2 mb-2">
                    <input class="form-control mono" :value="f.fullPath" readonly>
                    <button type="button" class="btn btn-icon" :class="f.locked || editingLib.settings.locked ? 'btn-lock-on' : 'btn-ghost'" :disabled="editingLib.settings.locked"
                            @click="f.locked = !f.locked" :aria-pressed="!!f.locked" :aria-label="f.locked ? 'Unlock folder' : 'Lock folder'"
                            :title="editingLib.settings.locked ? 'The whole library is locked' : (f.locked ? 'Locked: files here are never deleted. Click to unlock.' : 'Lock this folder (source of truth)')">
                      <i class="bi" :class="f.locked || editingLib.settings.locked ? 'bi-lock-fill' : 'bi-unlock'"></i>
                    </button>
                    <button type="button" class="btn btn-ghost btn-icon" @click="editingLib.folders.splice(idx, 1)" aria-label="Remove folder"><i class="bi bi-x-lg"></i></button>
                  </div>
                </template>
                <div class="form-text mb-2" x-show="editingLib.folders.length"><i class="bi bi-lock"></i> Lock a folder to make it a source of truth: Audivault never deletes or overwrites files in it. Renaming and organizing still work.</div>
                <div class="d-flex gap-2 mb-3">
                  <input class="form-control mono" x-model="newFolder" placeholder="Path to a folder of audiobooks" @keydown.enter.prevent="addFolder()">
                  <button type="button" class="btn btn-ghost" @click="addFolder()">Add</button>
                  <button type="button" class="btn btn-ghost" @click="openPicker('folder')"><i class="bi bi-folder2-open"></i> Browse</button>
                </div>
                <div class="mb-3">
                  <label class="form-label">Import folder</label>
                  <div class="d-flex gap-2">
                    <input class="form-control mono" x-model="editingLib.settings.importFolder" placeholder="Optional: inbox folder for new books">
                    <button type="button" class="btn btn-ghost" @click="openPicker('import')"><i class="bi bi-folder2-open"></i> Browse</button>
                  </div>
                  <div class="form-text">Books dropped here show up on the Import page and go into the library using the template below.</div>
                  <div class="row g-2 align-items-center mt-1">
                    <div class="col-sm-5"><label class="form-label mb-0" for="import-mode">When importing</label></div>
                    <div class="col-sm-7">
                      <select class="form-select" id="import-mode" x-model="editingLib.settings.importMode">
                        <option value="move">Move files into the library</option>
                        <option value="copy">Copy files (leave the originals)</option>
                      </select>
                    </div>
                  </div>
                  <div class="form-check form-switch mt-2">
                    <input class="form-check-input" type="checkbox" id="tg-autoimport" x-model="editingLib.settings.autoImport" :disabled="!editingLib.settings.importFolder">
                    <label class="form-check-label" for="tg-autoimport">Import automatically
                      <span class="d-block small text-muted">New books are imported once their files stop changing, when the provider agrees: same ASIN, matching title and author, or a near-exact title whose length matches (the provider then supplies the author). A book whose library folder already exists is skipped. Others stay on the Import page with the closest match filled in.</span></label>
                  </div>
                </div>
                <div class="mb-3">
                  <label class="form-label">Folder naming template</label>
                  <input class="form-control mono" x-model="editingLib.settings.namingTemplate" @input="updatePreview()">
                  <div class="form-text">Examples: <template x-for="p in preview" :key="p"><div class="mono" style="color:var(--text)" x-text="p"></div></template></div>
                </div>
                <div class="row g-3 mb-3">
                  <div class="col-md-6"><label class="form-label">Metadata provider</label>
                    <select class="form-select" x-model="editingLib.settings.metadataProvider"><template x-for="p in providers" :key="p.value"><option :value="p.value" x-text="p.text" :selected="p.value === editingLib.settings.metadataProvider"></option></template></select></div>
                  <div class="col-md-3"><label class="form-label">Auto scan (min)</label><input class="form-control" type="number" min="0" x-model="editingLib.settings.scanIntervalMinutes"></div>
                  <div class="col-md-3"><label class="form-label">Finished when (s) left</label><input class="form-control" type="number" min="0" x-model.number="editingLib.settings.markAsFinishedTimeRemaining"></div>
                  <div class="col-12"><label class="form-label">Metadata refresh (hours)</label><input class="form-control" type="number" min="0" style="max-width:160px" x-model="editingLib.settings.metadataRefreshHours"><div class="form-text">0 is off. Fills empty description, genres, narrator, series, and cover in small batches. Does not replace metadata that is already set, and does not run just because the server started.</div></div>
                </div>
                <template x-for="t in toggles" :key="t[0]">
                  <div class="form-check form-switch mb-2">
                    <input class="form-check-input" type="checkbox" :id="'tg-' + t[0]" x-model="editingLib.settings[t[0]]">
                    <label class="form-check-label" :for="'tg-' + t[0]"><span x-text="t[1]"></span> <span class="d-block small text-muted" x-text="t[2]"></span></label>
                  </div>
                </template>
                <div class="panel mt-3"><div class="panel-body">
                  <div class="form-check form-switch mb-2">
                    <input class="form-check-input" type="checkbox" id="tg-watch" :checked="!editingLib.settings.disableWatcher" @change="editingLib.settings.disableWatcher = !$event.target.checked">
                    <label class="form-check-label" for="tg-watch">Watch library folders for changes
                      <span class="d-block small text-muted">Added, changed or removed books are picked up automatically. Only the affected author folder is rescanned, after files stop changing.</span></label>
                  </div>
                  <div class="row g-2 align-items-center" x-show="!editingLib.settings.disableWatcher">
                    <div class="col-md-5"><label class="form-label mb-0" for="watch-mode">Detection method</label></div>
                    <div class="col-md-7">
                      <select class="form-select" id="watch-mode" x-model="editingLib.settings.watchMode">
                        <option value="auto">Automatic</option>
                        <option value="native">File system events</option>
                        <option value="polling">Polling (network shares, Docker Desktop)</option>
                      </select>
                    </div>
                    <div class="col-12 form-text">File system events are instant but don't reach network shares or Docker Desktop on Windows/macOS. Polling checks every 30 seconds and works everywhere.</div>
                  </div>
                </div></div>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-ghost" @click="editingLib = null" :disabled="savingLib">Cancel</button>
                <button class="btn btn-accent" :disabled="savingLib" x-text="savingLib ? 'Saving…' : (editingLib.id ? 'Save' : 'Create and scan')"></button>
              </div>
            </form>
          </div>
        </template>

        <!-- folder picker -->
        <template x-if="picker">
          <div class="ui-modal sm" style="z-index:1070">
            <div class="backdrop" @click="picker = null"></div>
            <div class="modal-content">
              <div class="modal-header"><h2 class="h6 m-0">Choose a folder</h2><button type="button" class="btn-close" data-dismiss @click="picker = null" aria-label="Close"></button></div>
              <div class="modal-body">
                <div class="mono small mb-2" x-text="picker.path || 'This computer'"></div>
                <div class="fs-list">
                  <template x-if="picker.parent !== null && picker.path"><button @click="browse(picker.parent)"><i class="bi bi-arrow-90deg-up"></i> ..</button></template>
                  <template x-for="d in picker.dirs" :key="d.path"><button @click="browse(d.path)"><i class="bi bi-folder" style="color:var(--accent)"></i> <span x-text="d.name"></span></button></template>
                  <div class="p-3 text-muted small" x-show="!picker.dirs.length">No subfolders</div>
                </div>
              </div>
              <div class="modal-footer"><button type="button" class="btn btn-ghost" @click="picker = null">Cancel</button><button class="btn btn-accent" :disabled="!picker.path" @click="choose()">Use this folder</button></div>
            </div>
          </div>
        </template>

        <!-- user editor -->
        <template x-if="userForm">
          <div class="ui-modal sm">
            <div class="backdrop" @click="userForm = null"></div>
            <form class="modal-content" @submit.prevent="saveUser()">
              <div class="modal-header"><h2 class="h5 m-0" x-text="userForm.id ? 'Edit user' : 'New user'"></h2><button type="button" class="btn-close" data-dismiss @click="userForm = null" aria-label="Close"></button></div>
              <div class="modal-body">
                <div class="mb-2"><label class="form-label">Username</label><input class="form-control" x-model="userForm.username" required></div>
                <div class="mb-2"><label class="form-label" x-text="userForm.id ? 'New password (optional)' : 'Password'"></label><input class="form-control" type="password" x-model="userForm.password" autocomplete="new-password"></div>
                <div class="mb-3" x-show="userForm.type !== 'root'"><label class="form-label">Type</label>
                  <select class="form-select" x-model="userForm.type"><option value="user">User</option><option value="admin" :disabled="$store.app.user.type !== 'root'">Admin</option><option value="guest">Guest</option></select></div>
                <label class="form-label">Permissions</label>
                <template x-for="p in [['download','Download'],['update','Edit metadata'],['delete','Delete'],['accessExplicitContent','Explicit content'],['accessAllLibraries','All libraries']]" :key="p[0]">
                  <div class="form-check"><input class="form-check-input" type="checkbox" :id="'perm-' + p[0]" x-model="userForm.permissions[p[0]]"><label class="form-check-label" :for="'perm-' + p[0]" x-text="p[1]"></label></div>
                </template>
                <template x-if="!userForm.permissions.accessAllLibraries">
                  <div class="mt-2"><label class="form-label">Allowed libraries</label>
                    <template x-for="l in $store.app.libraries" :key="l.id"><div class="form-check"><input class="form-check-input" type="checkbox" :value="l.id" x-model="userForm.librariesAccessible" :id="'ul-' + l.id"><label class="form-check-label" :for="'ul-' + l.id" x-text="l.name"></label></div></template>
                  </div>
                </template>
                <div class="form-check form-switch mt-3" x-show="userForm.id && userForm.type !== 'root'"><input class="form-check-input" type="checkbox" id="u-active" x-model="userForm.isActive"><label class="form-check-label" for="u-active">Account enabled</label></div>
              </div>
              <div class="modal-footer"><button type="button" class="btn btn-ghost" @click="userForm = null">Cancel</button><button class="btn btn-accent">Save</button></div>
            </form>
          </div>
        </template>
      </div>
    </template>

  </main>
  </template>

  <!-- ================================================================ series match -->
  <template x-if="$store.app.modal && $store.app.modal.type === 'series-match'">
    <div class="ui-modal" x-data="seriesMatchModal()">
      <div class="backdrop" @click="close()"></div>
      <div class="modal-content">
        <div class="modal-header">
          <div class="min-w-0">
            <div class="text-muted small text-truncate" x-text="seriesName"></div>
            <h2 class="h5 m-0" x-text="books.length ? `Book ${index + 1} of ${books.length}` : 'Match series'"></h2>
          </div>
          <button type="button" class="btn-close" data-dismiss @click="close()" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div x-show="loading" class="py-5 text-center"><div class="spinner-border"></div></div>
          <template x-if="!loading && !books.length">
            <div class="empty"><i class="bi bi-collection"></i>No books to match.</div>
          </template>
          <template x-if="!loading && book">
            <div>
              <div class="mb-3">
                <div class="fw-semibold" x-text="book.title"></div>
                <div class="small text-muted text-break" x-text="[sourceLabel(book), book.author, numberLabel(book), book.relPath].filter(Boolean).join(' · ')"></div>
              </div>
              <form class="row g-2 mb-3" @submit.prevent="search(true)">
                <div class="col-md-3"><select class="form-select" x-model="provider" @change="search(true)"><template x-for="p in providers" :key="p.value"><option :value="p.value" x-text="p.text"></option></template></select></div>
                <div class="col-md-4"><input class="form-control" x-model="qTitle" placeholder="Title or ASIN"></div>
                <div class="col-md-3"><input class="form-control" x-model="qAuthor" placeholder="Author"></div>
                <div class="col-md-2 d-grid"><button class="btn btn-accent" :disabled="searching"><span class="spinner-border spinner-border-sm" style="color:inherit" x-show="searching"></span><span x-show="!searching">Search</span></button></div>
              </form>
              <div x-show="searching && !results.length" class="py-4 text-center"><div class="spinner-border"></div></div>
              <div x-show="!searching && !results.length" class="text-muted">No results.</div>
              <div class="d-grid gap-2" style="max-height:45vh;overflow-y:auto">
                <template x-for="(r, idx) in results" :key="(r.asin || idx) + '-' + idx">
                  <div class="match-result" :class="isSelected(r) && 'selected'" @click="select(r)">
                    <img :src="r.cover || ''" alt="" x-show="r.cover">
                    <div class="min-w-0">
                      <div class="fw-semibold" x-text="r.title + (r.subtitle ? ': ' + r.subtitle : '')"></div>
                      <div class="small text-muted" x-text="[r.author, r.narrator && 'Narr. ' + r.narrator, r.publishedYear, r.duration ? fmt.duration(r.duration * 60) : ''].filter(Boolean).join(' · ')"></div>
                      <div x-show="seriesChip(r)"><span class="chip chip-accent mt-1" x-text="seriesChip(r)"></span></div>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </template>
        </div>
        <div class="modal-footer" x-show="!loading && books.length">
          <button type="button" class="btn btn-ghost me-auto" @click="skip()" :disabled="saving">Skip</button>
          <button type="button" class="btn btn-ghost" @click="back()" :disabled="index === 0 || saving">Back</button>
          <button type="button" class="btn btn-accent" @click="next()" :disabled="saving">
            <span class="spinner-border spinner-border-sm me-1" style="color:inherit" x-show="saving"></span>
            <span x-text="atEnd ? 'Save and organize' : 'Next'"></span>
          </button>
        </div>
      </div>
    </div>
  </template>

  <!-- ================================================================ edit modal -->
  <template x-if="$store.app.modal && $store.app.modal.type === 'edit'">
    <div class="ui-modal" x-data="editModal()">
      <div class="backdrop" @click="close()"></div>
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="h5 m-0 text-truncate" x-text="item.media.metadata.title"></h2>
          <button type="button" class="btn-close" data-dismiss @click="close()" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="nav-tabs-ui">
            <button :class="tab === 'details' && 'active'" @click="tab = 'details'">Details</button>
            <button :class="tab === 'match' && 'active'" @click="tab = 'match'">Match</button>
            <button :class="tab === 'cover' && 'active'" @click="tab = 'cover'">Cover</button>
            <button :class="tab === 'chapters' && 'active'" @click="tab = 'chapters'">Chapters</button>
            <button :class="tab === 'files' && 'active'" @click="tab = 'files'">Tracks</button>
          </div>

          <template x-if="tab === 'details'">
            <form @submit.prevent="saveDetails()">
              <div class="row g-2">
                <div class="col-md-8"><label class="form-label">Title</label><input class="form-control" x-model="form.title" required></div>
                <div class="col-md-4"><label class="form-label">Subtitle</label><input class="form-control" x-model="form.subtitle"></div>
                <div class="col-md-6"><label class="form-label">Authors</label><input class="form-control" x-model="form.authors" placeholder="Name & Name"></div>
                <div class="col-md-6"><label class="form-label">Narrators</label><input class="form-control" x-model="form.narrators" placeholder="Name, Name"></div>
                <div class="col-12">
                  <label class="form-label">Series</label>
                  <template x-for="(s, idx) in form.series" :key="idx">
                    <div class="d-flex gap-2 mb-2">
                      <input class="form-control" x-model="s.name" placeholder="Series name">
                      <input class="form-control" style="max-width:110px" x-model="s.sequence" placeholder="#">
                      <button type="button" class="btn btn-ghost btn-icon" @click="form.series.splice(idx, 1)" aria-label="Remove series"><i class="bi bi-x-lg"></i></button>
                    </div>
                  </template>
                  <button type="button" class="btn btn-ghost btn-sm" @click="form.series.push({ name: '', sequence: '' })"><i class="bi bi-plus"></i> Add series</button>
                </div>
                <div class="col-md-6"><label class="form-label">Genres</label><input class="form-control" x-model="form.genres" placeholder="Comma separated"></div>
                <div class="col-md-6"><label class="form-label">Tags</label><input class="form-control" x-model="form.tags" placeholder="Comma separated"></div>
                <div class="col-md-3 col-6"><label class="form-label">Year</label><input class="form-control" x-model="form.publishedYear"></div>
                <div class="col-md-5 col-6"><label class="form-label">Publisher</label><input class="form-control" x-model="form.publisher"></div>
                <div class="col-md-4"><label class="form-label">Language</label><input class="form-control" x-model="form.language"></div>
                <div class="col-md-6"><label class="form-label">ASIN</label><input class="form-control mono" x-model="form.asin"></div>
                <div class="col-md-6"><label class="form-label">ISBN</label><input class="form-control mono" x-model="form.isbn"></div>
                <div class="col-12"><label class="form-label">Description</label><textarea class="form-control" rows="6" x-model="form.description"></textarea></div>
                <div class="col-12 d-flex gap-4">
                  <div class="form-check"><input class="form-check-input" type="checkbox" id="f-exp" x-model="form.explicit"><label class="form-check-label" for="f-exp">Explicit</label></div>
                  <div class="form-check"><input class="form-check-input" type="checkbox" id="f-abr" x-model="form.abridged"><label class="form-check-label" for="f-abr">Abridged</label></div>
                </div>
              </div>
              <div class="d-flex justify-content-end gap-2 mt-3"><button type="button" class="btn btn-ghost" @click="close()">Close</button><button class="btn btn-accent" :disabled="saving">Save details</button></div>
            </form>
          </template>

          <template x-if="tab === 'match'">
            <div>
              <form class="row g-2 mb-3" @submit.prevent="search()">
                <div class="col-md-3"><select class="form-select" x-model="provider"><template x-for="p in providers" :key="p.value"><option :value="p.value" x-text="p.text" :selected="p.value === provider"></option></template></select></div>
                <div class="col-md-4"><input class="form-control" x-model="qTitle" placeholder="Title or ASIN"></div>
                <div class="col-md-3"><input class="form-control" x-model="qAuthor" placeholder="Author"></div>
                <div class="col-md-2 d-grid"><button class="btn btn-accent" :disabled="searching"><span class="spinner-border spinner-border-sm" style="color:inherit" x-show="searching"></span><span x-show="!searching">Search</span></button></div>
              </form>
              <template x-if="!picked">
                <div class="d-grid gap-2">
                  <template x-for="(r, idx) in results" :key="idx">
                    <div class="match-result" @click="picked = r">
                      <img :src="r.cover || ''" alt="" x-show="r.cover">
                      <div class="min-w-0">
                        <div class="fw-semibold" x-text="r.title + (r.subtitle ? ': ' + r.subtitle : '')"></div>
                        <div class="small text-muted" x-text="[r.author, r.narrator && 'Narr. ' + r.narrator, r.publishedYear, r.duration ? fmt.duration(r.duration * 60) : ''].filter(Boolean).join(' · ')"></div>
                        <div x-show="r.series && r.series.length"><span class="chip chip-accent mt-1" x-text="(r.series || []).map(s => s.series + (s.sequence ? ' #' + s.sequence : '')).join(', ')"></span></div>
                      </div>
                    </div>
                  </template>
                </div>
              </template>
              <template x-if="picked">
                <div class="panel"><div class="panel-body">
                  <div class="d-flex gap-3 mb-3">
                    <img :src="picked.cover" x-show="picked.cover" style="width:110px;height:110px;object-fit:cover;border-radius:8px;border:1px solid var(--border)" alt="">
                    <dl class="meta-grid flex-grow-1 mb-0">
                      <dt>Title</dt><dd x-text="picked.title"></dd>
                      <dt>Author</dt><dd x-text="picked.author || '—'"></dd>
                      <dt>Narrator</dt><dd x-text="picked.narrator || '—'"></dd>
                      <dt>Series</dt><dd x-text="(picked.series || []).map(s => s.series + (s.sequence ? ' #' + s.sequence : '')).join(', ') || '—'"></dd>
                      <dt>Year</dt><dd x-text="picked.publishedYear || '—'"></dd>
                      <dt>ASIN / ISBN</dt><dd class="mono" x-text="[picked.asin, picked.isbn].filter(Boolean).join(' / ') || '—'"></dd>
                    </dl>
                  </div>
                  <div class="form-check mb-3"><input class="form-check-input" type="checkbox" id="m-ovr" x-model="override"><label class="form-check-label" for="m-ovr">Replace existing values (otherwise only empty fields are filled)</label></div>
                  <div class="d-flex gap-2 justify-content-end"><button class="btn btn-ghost" @click="picked = null">Back to results</button><button class="btn btn-accent" :disabled="saving" @click="applyMatch()">Apply match</button></div>
                </div></div>
              </template>
            </div>
          </template>

          <template x-if="tab === 'cover'">
            <div>
              <div class="d-flex flex-wrap gap-3 mb-3 align-items-start">
                <div style="width:140px" class="cover"><img x-show="item.media.coverPath" :src="$store.app.cover(item)" alt="Current cover"><div class="cover-ph" x-show="!item.media.coverPath">No cover</div></div>
                <div class="flex-grow-1">
                  <label class="form-label">From URL</label>
                  <div class="d-flex gap-2 mb-2"><input class="form-control" x-model="coverUrl" placeholder="https://…"><button class="btn btn-accent" :disabled="!coverUrl" @click="setCover(coverUrl)">Use</button></div>
                  <label class="form-label">Upload</label>
                  <input class="form-control mb-2" type="file" accept="image/*" @change="uploadCover($event)">
                  <button class="btn btn-danger-soft btn-sm" x-show="item.media.coverPath" @click="removeCover()">Remove cover</button>
                </div>
              </div>
              <form class="row g-2 mb-3" @submit.prevent="searchCovers()">
                <div class="col-md-3"><select class="form-select" x-model="coverProvider"><template x-for="p in coverProviders" :key="p.value"><option :value="p.value" x-text="p.text" :selected="p.value === coverProvider"></option></template></select></div>
                <div class="col-md-4"><input class="form-control" x-model="qTitle" placeholder="Title"></div>
                <div class="col-md-3"><input class="form-control" x-model="qAuthor" placeholder="Author"></div>
                <div class="col-md-2 d-grid"><button class="btn btn-ghost" :disabled="coverSearching">Find covers</button></div>
              </form>
              <div x-show="coverSearching" class="py-3 text-center"><div class="spinner-border"></div></div>
              <div class="book-grid" style="grid-template-columns:repeat(auto-fill,minmax(110px,1fr))">
                <template x-for="url in covers" :key="url"><div class="cover-choice" @click="setCover(url)"><img :src="url" loading="lazy" alt="Cover option"></div></template>
              </div>
            </div>
          </template>

          <template x-if="tab === 'chapters'">
            <div>
              <div class="d-flex flex-wrap gap-2 mb-3">
                <input class="form-control mono" style="max-width:200px" x-model="chapterAsin" placeholder="ASIN">
                <button class="btn btn-ghost" :disabled="!chapterAsin" @click="lookupChapters()"><i class="bi bi-cloud-download"></i> Look up chapters</button>
                <button class="btn btn-ghost ms-auto" @click="addChapter()"><i class="bi bi-plus"></i> Add</button>
              </div>
              <div class="panel" style="max-height:50vh;overflow-y:auto">
                <table class="table table-dark-ui">
                  <thead><tr><th style="width:130px">Start</th><th>Title</th><th style="width:50px"></th></tr></thead>
                  <tbody>
                    <template x-for="(c, idx) in chapters" :key="idx">
                      <tr>
                        <td><input class="form-control form-control-sm mono" x-model="c.startStr"></td>
                        <td><input class="form-control form-control-sm" x-model="c.title"></td>
                        <td><button class="btn btn-ghost btn-sm btn-icon" @click="chapters.splice(idx, 1)" aria-label="Remove chapter"><i class="bi bi-x-lg"></i></button></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
              <div class="d-flex justify-content-between align-items-center mt-3">
                <span class="small text-muted" x-text="'Book length ' + fmt.clock(item.media.duration)"></span>
                <button class="btn btn-accent" @click="saveChapters()">Save chapters</button>
              </div>
            </div>
          </template>

          <template x-if="tab === 'files'">
            <div>
              <p class="text-muted small">Untick files that should not be played (samples, intros). Chapters are rebuilt from the remaining files.</p>
              <div class="panel mb-3">
                <table class="table table-dark-ui">
                  <thead><tr><th style="width:40px">Play</th><th>#</th><th>File</th><th class="text-end">Duration</th></tr></thead>
                  <tbody>
                    <template x-for="f in files" :key="f.ino">
                      <tr>
                        <td><input class="form-check-input" type="checkbox" :checked="!f.exclude" @change="f.exclude = !$event.target.checked" aria-label="Include file"></td>
                        <td class="text-muted" x-text="f.index"></td><td class="mono small" x-text="f.metadata.relPath"></td>
                        <td class="text-end mono" x-text="fmt.clock(f.duration)"></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
              <div class="d-flex justify-content-end"><button class="btn btn-accent" @click="saveFiles()">Save track list</button></div>
            </div>
          </template>
        </div>
      </div>
    </div>
  </template>

  <!-- organize single item -->
  <template x-if="$store.app.modal && $store.app.modal.type === 'organize-item'">
    <div class="ui-modal sm" x-data="organizeItemModal()">
      <div class="backdrop" @click="$store.app.modal = null"></div>
      <div class="modal-content">
        <div class="modal-header"><h2 class="h5 m-0">Rename folder</h2><button type="button" class="btn-close" data-dismiss @click="$store.app.modal = null" aria-label="Close"></button></div>
        <div class="modal-body">
          <div x-show="!plan" class="text-center py-3"><div class="spinner-border"></div></div>
          <template x-if="plan">
            <div>
              <label class="form-label">Current</label><div class="mono mb-3" x-text="plan.from"></div>
              <label class="form-label">New</label><div class="mono mb-3" style="color:var(--accent)" x-text="plan.to"></div>
              <div x-show="plan.status === 'unchanged'" class="status-unchanged">Already matches the template.</div>
              <div x-show="plan.detail" class="small mt-2" :class="`status-${plan.status}`" x-text="plan.detail"></div>
            </div>
          </template>
        </div>
        <div class="modal-footer"><button type="button" class="btn btn-ghost" @click="$store.app.modal = null">Cancel</button><button class="btn btn-accent" :disabled="!plan || (plan.status !== 'ok' && plan.status !== 'stale') || busy" @click="apply()" x-text="plan && plan.status === 'stale' ? 'Remove leftover' : 'Rename'"></button></div>
      </div>
    </div>
  </template>

  <!-- add to collection -->
  <template x-if="$store.app.modal && $store.app.modal.type === 'collection'">
    <div class="ui-modal sm" x-data="{ list: [], name: '', async init() { this.list = (await api('GET', `/api/libraries/${$store.app.modal.item.libraryId}/collections`)).results; },
         async add(c) { await api('POST', `/api/collections/${c.id}/book`, { id: $store.app.modal.item.id }); $store.app.toast('Added to ' + c.name, 'success'); $store.app.modal = null; },
         async create() { const it = $store.app.modal.item; await api('POST', '/api/collections', { libraryId: it.libraryId, name: this.name, books: [it.id] }); $store.app.toast('Collection created', 'success'); $store.app.modal = null; } }">
      <div class="backdrop" @click="$store.app.modal = null"></div>
      <div class="modal-content">
        <div class="modal-header"><h2 class="h5 m-0">Add to collection</h2><button type="button" class="btn-close" data-dismiss @click="$store.app.modal = null" aria-label="Close"></button></div>
        <div class="modal-body">
          <div class="d-grid gap-2 mb-3">
            <template x-for="c in list" :key="c.id">
              <button class="btn btn-ghost text-start d-flex justify-content-between" @click="add(c)" :disabled="c.books.some(b => b.id === $store.app.modal.item.id)">
                <span x-text="c.name"></span><span class="text-muted small" x-text="c.books.some(b => b.id === $store.app.modal.item.id) ? 'Already added' : c.books.length + ' books'"></span>
              </button>
            </template>
          </div>
          <form class="d-flex gap-2" @submit.prevent="create()" x-show="$store.app.canUpdate"><input class="form-control" x-model="name" placeholder="New collection name" required><button class="btn btn-accent">Create</button></form>
        </div>
      </div>
    </div>
  </template>

  <!-- ================================================================ player -->
  <template x-if="$store.player.active">
    <div class="player" x-data>
      <div class="inner">
        <div class="now">
          <a :href="`#/item/${$store.player.item.id}`">
            <img x-show="$store.player.item.media.coverPath" :src="$store.app.cover($store.player.item)" alt="">
            <div class="ph" x-show="!$store.player.item.media.coverPath"></div>
          </a>
          <div class="min-w-0">
            <div class="t" x-text="$store.player.item.media.metadata.title"></div>
            <div class="s" x-text="$store.player.chapter ? $store.player.chapter.title : $store.player.item.media.metadata.authorName"></div>
          </div>
        </div>
        <div class="controls">
          <button class="ctrl d-none d-sm-grid" @click="$store.player.prevChapter()" title="Previous chapter" aria-label="Previous chapter"><i class="bi bi-skip-start-fill"></i></button>
          <button class="ctrl" @click="$store.player.jump(-10)" title="Back 10s" aria-label="Back 10 seconds"><i class="bi bi-arrow-counterclockwise"></i></button>
          <button class="play-btn" @click="$store.player.toggle()" :aria-label="$store.player.playing ? 'Pause' : 'Play'"><i class="bi" :class="$store.player.playing ? 'bi-pause-fill' : 'bi-play-fill'"></i></button>
          <button class="ctrl" @click="$store.player.jump(30)" title="Forward 30s" aria-label="Forward 30 seconds"><i class="bi bi-arrow-clockwise"></i></button>
          <button class="ctrl d-none d-sm-grid" @click="$store.player.nextChapter()" title="Next chapter" aria-label="Next chapter"><i class="bi bi-skip-end-fill"></i></button>
        </div>
        <div class="extras">
          <div class="position-relative" x-data="{ open: false }" @click.outside="open = false">
            <button class="btn btn-ghost btn-sm" @click="open = !open" title="Sleep timer"><i class="bi bi-moon"></i> <span x-text="$store.player.sleepLabel"></span></button>
            <div class="menu" x-show="open" x-cloak @click="open = false" style="bottom:calc(100% + 6px);top:auto">
              <div class="menu-label">Sleep timer</div>
              <template x-for="m in [5, 15, 30, 45, 60]" :key="m"><button @click="$store.player.setSleep(m)" x-text="m + ' minutes'"></button></template>
              <button @click="$store.player.setSleep('chapter')">End of chapter</button>
              <button @click="$store.player.setSleep(null)">Off</button>
            </div>
          </div>
          <div class="position-relative" x-data="{ open: false }" @click.outside="open = false">
            <button class="btn btn-ghost btn-sm mono" @click="open = !open" title="Playback speed" x-text="$store.player.rate + '×'"></button>
            <div class="menu" x-show="open" x-cloak @click="open = false" style="bottom:calc(100% + 6px);top:auto;min-width:120px">
              <template x-for="r in [0.75, 0.9, 1, 1.1, 1.2, 1.25, 1.5, 1.75, 2, 2.5, 3]" :key="r"><button :class="$store.player.rate === r && 'active'" @click="$store.player.setRate(r)" x-text="r + '×'"></button></template>
            </div>
          </div>
          <div class="position-relative" x-data="{ open: false }" @click.outside="open = false">
            <button class="btn btn-ghost btn-sm" @click="open = !open" title="Chapters" aria-label="Chapters"><i class="bi bi-list-ol"></i></button>
            <div class="menu" x-show="open" x-cloak style="bottom:calc(100% + 6px);top:auto;min-width:300px">
              <template x-for="(c, idx) in $store.player.chapters" :key="idx">
                <button :class="$store.player.chapterIndex === idx && 'active'" @click="$store.player.seek(c.start); open = false"><span class="text-truncate" x-text="c.title"></span><span class="ms-auto mono small text-muted" x-text="fmt.clock(c.start)"></span></button>
              </template>
            </div>
          </div>
          <button class="btn btn-ghost btn-sm btn-icon" @click="$store.player.stop()" title="Close player" aria-label="Close player"><i class="bi bi-x-lg"></i></button>
        </div>
      </div>
      <div class="scrub">
        <span x-text="fmt.clock($store.player.time)"></span>
        <input type="range" min="0" :max="$store.player.duration" step="1" :value="$store.player.time" @change="$store.player.seek(+$event.target.value)" aria-label="Seek">
        <span x-text="'-' + fmt.clock(($store.player.duration - $store.player.time) / $store.player.rate)"></span>
      </div>
    </div>
  </template>
</div>
</template>

<!-- ================================================================ dialogs (confirm / alert) -->
<template x-for="(d, i) in $store.dialogs.stack" :key="d.id">
  <div class="ui-modal sm dialog" :style="`z-index:${1080 + i}`" role="alertdialog" aria-modal="true" :aria-labelledby="`dlg-title-${d.id}`"
       x-init="$nextTick(() => { const el = $el.querySelector(d.input ? 'input' : (d.danger && d.kind === 'confirm' ? '[data-cancel]' : '[data-ok]')); if (el) { el.focus(); if (d.input && el.select) el.select(); } })">
    <div class="backdrop" @click="$store.dialogs.close(d, false)"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="h5 m-0 d-flex align-items-center gap-2" :id="`dlg-title-${d.id}`">
          <i class="bi" :class="d.danger ? 'bi-exclamation-triangle-fill dialog-icon-danger' : (d.input ? 'bi-pencil' : 'bi-question-circle dialog-icon')"></i>
          <span x-text="d.title || (d.kind === 'alert' ? 'Notice' : 'Are you sure?')"></span>
        </h2>
        <button type="button" class="btn-close" data-dismiss aria-label="Close" @click="$store.dialogs.close(d, false)"></button>
      </div>
      <div class="modal-body">
        <p class="mb-0" x-show="d.message" x-text="d.message"></p>
        <div class="mt-3" x-show="d.input">
          <label class="form-label" x-show="d.inputLabel" :for="`dlg-input-${d.id}`" x-text="d.inputLabel"></label>
          <input class="form-control" :id="`dlg-input-${d.id}`" x-model="d.inputValue" @keydown.enter.prevent="$store.dialogs.accept(d)">
        </div>
        <div class="dialog-detail mono mt-3" x-show="d.detail" x-text="d.detail"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" data-cancel x-show="d.kind === 'confirm'" @click="$store.dialogs.close(d, false)" x-text="d.cancelText"></button>
        <button type="button" data-ok :class="d.danger ? 'btn btn-danger-solid' : 'btn btn-accent'" @click="$store.dialogs.accept(d)" x-text="d.confirmText"></button>
      </div>
    </div>
  </div>
</template>

<!-- ================================================================ toasts -->
<div class="toasts" x-data aria-live="polite">
  <template x-for="t in $store.app.toasts" :key="t.id">
    <div class="toast-ui d-flex align-items-start gap-2" :class="t.kind" role="status">
      <span class="flex-grow-1" x-text="t.message"></span>
      <template x-if="t.action"><a class="fw-semibold text-nowrap" :href="t.action.href" @click="$store.app.dismissToast(t.id)" x-text="t.action.label"></a></template>
      <button type="button" class="btn-close btn-close-sm" style="font-size:.7rem" aria-label="Dismiss" @click="$store.app.dismissToast(t.id)"></button>
    </div>
  </template>
</div>
</body>
</html>
