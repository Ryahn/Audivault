<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audivault</title>
  <meta name="description" content="An open-source, self-hosted audiobook server with Audiobookshelf API compatibility.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='1' width='30' height='30' rx='8' fill='%230f2a33' stroke='%232fd8f0' stroke-width='2'/%3E%3Cpath d='M9 21v-6a7 7 0 0 1 14 0v6' fill='none' stroke='%232fd8f0' stroke-width='2.4' stroke-linecap='round'/%3E%3Crect x='7' y='18' width='4' height='7' rx='1.5' fill='%232fd8f0'/%3E%3Crect x='21' y='18' width='4' height='7' rx='1.5' fill='%232fd8f0'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/app.css">
  <script type="module" src="/static/js/main.js"></script>
</head>
<body x-data>
<audio id="audio-el" preload="auto"></audio>

<!-- ================================================================ splash -->
<div x-show="!$store.app.ready" class="auth-wrap"><div class="spinner-border" role="status"></div></div>

<!-- ================================================================ auth -->
<template x-if="$store.app.ready && !$store.app.user">
  <div class="auth-wrap" x-data="authView()">
    <div class="auth-card panel">
      <div class="panel-body p-4">
        <div class="brand mb-1"><span class="brand-mark"><i class="bi bi-headphones"></i></span> Audivault</div>
        <p class="text-muted small mb-4">An open-source, self-hosted audiobook server with Audiobookshelf API compatibility.</p>
        <template x-if="!$store.app.initialized">
          <form @submit.prevent="setup()">
            <h2 class="h5 mb-1">Create the admin account</h2>
            <p class="text-muted small mb-3">This is the root user for your server.</p>
            <div class="mb-3"><label class="form-label">Username</label><input class="form-control" x-model="username" autocomplete="username" required></div>
            <div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" x-model="password" autocomplete="new-password"></div>
            <div class="mb-3"><label class="form-label">Confirm password</label><input class="form-control" type="password" x-model="password2" autocomplete="new-password"></div>
            <div class="text-danger small mb-2" x-text="error" x-show="error"></div>
            <button class="btn btn-accent w-100" :disabled="busy">Create account</button>
          </form>
        </template>
        <template x-if="$store.app.initialized">
          <form @submit.prevent="login()">
            <div class="mb-3"><label class="form-label">Username</label><input class="form-control" x-model="username" autocomplete="username" autofocus required></div>
            <div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" x-model="password" autocomplete="current-password"></div>
            <div class="text-danger small mb-2" x-text="error" x-show="error"></div>
            <button class="btn btn-accent w-100" :disabled="busy"><span x-show="busy" class="spinner-border spinner-border-sm me-2" style="color:inherit"></span>Sign in</button>
          </form>
        </template>
      </div>
    </div>
  </div>
</template>

<!-- ================================================================ app shell -->
<template x-if="$store.app.ready && $store.app.user">
<div>
  <header class="topbar">
    <div class="inner">
      <a class="brand" href="#/home"><span class="brand-mark"><i class="bi bi-headphones"></i></span><span class="d-none d-sm-inline">Audivault</span></a>
      <select class="form-select form-select-sm w-auto" x-show="$store.app.libraries.length > 1" :value="$store.app.libraryId"
              @change="$store.app.setLibrary($event.target.value); $store.app.go('home')" aria-label="Library">
        <template x-for="l in $store.app.libraries" :key="l.id"><option :value="l.id" x-text="l.name"></option></template>
      </select>
      <nav class="nav-links ms-2">
        <a href="#/home" :class="$store.app.route.name === 'home' && 'active'">Home</a>
        <a :href="`#/library/${$store.app.libraryId}`" :class="['library','item','series','author'].includes($store.app.route.name) && 'active'">Library</a>
        <a href="#/stats" :class="$store.app.route.name === 'stats' && 'active'">Stats</a>
        <template x-if="$store.app.isAdmin"><a href="#/import" :class="$store.app.route.name === 'import' && 'active'">Import</a></template>
        <template x-if="$store.app.isAdmin"><a href="#/organize" :class="$store.app.route.name === 'organize' && 'active'">Organize</a></template>
        <template x-if="$store.app.isAdmin"><a href="#/duplicates" :class="$store.app.route.name === 'duplicates' && 'active'">Duplicates <span class="nav-badge" x-show="$store.app.duplicateCount" x-text="$store.app.duplicateCount"></span></a></template>
      </nav>
      <form class="search flex-grow-1 ms-auto" @submit.prevent="$store.app.doSearch()">
        <div class="input-group input-group-sm">
          <span class="input-group-text"><i class="bi bi-search"></i></span>
          <input class="form-control" placeholder="Search titles, authors, narrators…" x-model="$store.app.search" aria-label="Search">
        </div>
      </form>
      <a href="#/settings/activity" class="btn btn-ghost btn-icon btn-sm" x-show="$store.app.runningTasks.length" :title="$store.app.runningTasks.map(t => t.title).join(', ')">
        <span class="spinner-border spinner-border-sm"></span>
      </a>
      <div class="position-relative" x-data="{ open: false }" @click.outside="open = false">
        <button class="btn btn-ghost btn-icon btn-sm" @click="open = !open" aria-label="Menu"><i class="bi bi-person-circle"></i></button>
        <div class="menu" x-show="open" x-cloak @click="open = false">
          <div class="menu-label" x-text="$store.app.user.username"></div>
          <a href="#/settings/account"><i class="bi bi-person"></i> Account</a>
          <template x-if="$store.app.isAdmin"><a href="#/settings/libraries"><i class="bi bi-gear"></i> Settings</a></template>
          <button @click="$store.app.toggleTheme()"><i class="bi" :class="$store.app.theme === 'dark' ? 'bi-sun' : 'bi-moon-stars'"></i> <span x-text="$store.app.theme === 'dark' ? 'Light theme' : 'Dark theme'"></span></button>
          <button @click="$store.app.logout()"><i class="bi bi-box-arrow-right"></i> Sign out</button>
        </div>
      </div>
    </div>
  </header>
  <nav class="mobile-nav">
    <a href="#/home" :class="$store.app.route.name === 'home' && 'active'">Home</a>
    <a :href="`#/library/${$store.app.libraryId}`" :class="$store.app.route.name === 'library' && 'active'">Library</a>
    <a href="#/stats" :class="$store.app.route.name === 'stats' && 'active'">Stats</a>
    <template x-if="$store.app.isAdmin"><a href="#/import" :class="$store.app.route.name === 'import' && 'active'">Import</a></template>
    <template x-if="$store.app.isAdmin"><a href="#/organize" :class="$store.app.route.name === 'organize' && 'active'">Organize</a></template>
    <template x-if="$store.app.isAdmin"><a href="#/duplicates" :class="$store.app.route.name === 'duplicates' && 'active'">Duplicates <span class="nav-badge" x-show="$store.app.duplicateCount" x-text="$store.app.duplicateCount"></span></a></template>
    <template x-if="$store.app.isAdmin"><a href="#/settings/libraries" :class="$store.app.route.name === 'settings' && 'active'">Settings</a></template>
  </nav>

  <template x-for="key in [$store.app.routeKey]" :key="key">
  <main>

    <!-- ============================================================ no library -->
    <template x-if="!$store.app.libraries.length && !['settings'].includes($store.app.route.name)">
      <div class="page"><div class="empty">
        <i class="bi bi-collection"></i>
        <h2 class="h5" style="color:var(--text)">No libraries yet</h2>
        <p x-show="$store.app.isAdmin">Point Audivault at a folder of audiobooks to get started.</p>
        <p x-show="!$store.app.isAdmin">Ask an administrator to give you access to a library.</p>
        <a href="#/settings/libraries" class="btn btn-accent" x-show="$store.app.isAdmin">Add a library</a>
      </div></div>
    </template>

    <!-- ============================================================ home -->
    <template x-if="$store.app.route.name === 'home' && $store.app.libraries.length">
      <div class="page" x-data="homeView()">
        <div x-show="loading" class="py-5 text-center"><div class="spinner-border"></div></div>
        <template x-if="!loading && !shelves.length">
          <div class="empty"><i class="bi bi-inboxes"></i>This library is empty. <span x-show="$store.app.isAdmin">Run a scan from <a href="#/settings/libraries">Settings</a> or <a href="#/import">import</a> some books.</span></div>
        </template>
        <template x-for="shelf in shelves" :key="shelf.id">
          <section class="mb-4">
            <div class="d-flex align-items-center justify-content-between mb-2">
              <h2 class="section-title" x-text="shelf.label"></h2>
              <span class="text-muted small" x-text="shelf.total + ' total'"></span>
            </div>
            <div class="shelf" x-html="shelf.entities.map(e => shelf.type === 'series' ? seriesCard(e) : shelf.type === 'authors' ? authorCard(e) : bookCard(e)).join('')"></div>
          </section>
        </template>
      </div>
    </template>

    <!-- ============================================================ stats -->
    <template x-if="$store.app.route.name === 'stats' && $store.app.libraries.length">
      <div class="page" x-data="statsView()">
        <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
          <h1 class="page-title me-3">Stats</h1>
          <div class="nav-tabs-ui mb-0 border-0">
            <button type="button" :class="tab === 'library' && 'active'" @click="setTab('library')">Library</button>
            <button type="button" :class="tab === 'you' && 'active'" @click="setTab('you')">Your listening</button>
          </div>
          <span class="text-muted small ms-auto" x-show="tab === 'library' && $store.app.library" x-text="$store.app.library.name"></span>
        </div>
        <div x-show="loading" class="py-5 text-center"><div class="spinner-border"></div></div>

        <div x-show="!loading && tab === 'library'">
          <template x-if="libraryStats && !libraryStats.totalItems">
            <div class="empty"><i class="bi bi-bar-chart"></i>This library has no books yet.</div>
          </template>
          <template x-if="libraryStats && libraryStats.totalItems">
            <div>
              <div class="stat-cards">
                <div class="stat-card"><div class="k">Books</div><div class="v" x-text="libraryStats.totalItems"></div></div>
                <div class="stat-card"><div class="k">Authors</div><div class="v" x-text="libraryStats.totalAuthors"></div></div>
                <div class="stat-card"><div class="k">Genres</div><div class="v" x-text="libraryStats.totalGenres"></div></div>
                <div class="stat-card"><div class="k">Narrators</div><div class="v" x-text="libraryStats.totalNarrators"></div></div>
                <div class="stat-card"><div class="k">Total length</div><div class="v" x-text="fmt.span(libraryStats.totalDuration)"></div></div>
                <div class="stat-card"><div class="k">Average length</div><div class="v" x-text="fmt.duration(libraryStats.avgDuration)"></div></div>
                <div class="stat-card"><div class="k">Library size</div><div class="v" x-text="fmt.size(libraryStats.totalSize)"></div></div>
                <div class="stat-card"><div class="k">Audio files</div><div class="v" x-text="libraryStats.numAudioTracks"></div></div>
                <div class="stat-card">
                  <div class="k">Longest book</div>
                  <div class="v" x-text="fmt.duration(libraryStats.longestItems[0].duration)"></div>
                  <a class="s" :href="`#/item/${libraryStats.longestItems[0].id}`" x-text="libraryStats.longestItems[0].title"></a>
                </div>
              </div>
              <div class="stat-grid">
                <section class="panel">
                  <div class="panel-head"><h2 class="section-title">Longest books</h2></div>
                  <div class="panel-body stat-list">
                    <template x-for="book in libraryStats.longestItems" :key="book.id">
                      <div>
                        <div class="stat-row-top">
                          <a class="text-truncate" :href="`#/item/${book.id}`" x-text="book.title"></a>
                          <span class="stat-row-value" x-text="fmt.duration(book.duration)"></span>
                        </div>
                        <div class="stat-bar"><span :style="`width:${pct(book.duration, libraryStats.longestItems, 'duration')}%`"></span></div>
                      </div>
                    </template>
                  </div>
                </section>
                <section class="panel">
                  <div class="panel-head"><h2 class="section-title">Largest books</h2></div>
                  <div class="panel-body stat-list">
                    <template x-for="book in libraryStats.largestItems" :key="book.id">
                      <div>
                        <div class="stat-row-top">
                          <a class="text-truncate" :href="`#/item/${book.id}`" x-text="book.title"></a>
                          <span class="stat-row-value" x-text="fmt.size(book.size)"></span>
                        </div>
                        <div class="stat-bar"><span :style="`width:${pct(book.size, libraryStats.largestItems, 'size')}%`"></span></div>
                      </div>
                    </template>
                  </div>
                </section>
                <section class="panel">
                  <div class="panel-head"><h2 class="section-title">Genres</h2></div>
                  <div class="panel-body stat-list">
                    <p class="text-muted small mb-0" x-show="!libraryStats.genresWithCount.length">No genres yet.</p>
                    <template x-for="row in libraryStats.genresWithCount" :key="row.genre">
                      <div>
                        <div class="stat-row-top">
                          <a class="text-truncate" :href="libraryFilter('genres', row.genre)" x-text="row.genre"></a>
                          <span class="stat-row-value" x-text="countLabel(row.count, 'book')"></span>
                        </div>
                        <div class="stat-bar"><span :style="`width:${pct(row.count, libraryStats.genresWithCount, 'count')}%`"></span></div>
                      </div>
                    </template>
                  </div>
                </section>
                <section class="panel">
                  <div class="panel-head"><h2 class="section-title">Authors</h2></div>
                  <div class="panel-body stat-list">
                    <p class="text-muted small mb-0" x-show="!libraryStats.authorsWithCount.length">No authors yet.</p>
                    <template x-for="row in libraryStats.authorsWithCount" :key="row.id">
                      <div>
                        <div class="stat-row-top">
                          <a class="text-truncate" :href="`#/author/${row.id}`" x-text="row.name"></a>
                          <span class="stat-row-value" x-text="countLabel(row.count, 'book')"></span>
                        </div>
                        <div class="stat-bar"><span :style="`width:${pct(row.count, libraryStats.authorsWithCount, 'count')}%`"></span></div>
                      </div>
                    </template>
                  </div>
                </section>
                <section class="panel">
                  <div class="panel-head"><h2 class="section-title">Narrators</h2></div>
                  <div class="panel-body stat-list">
                    <p class="text-muted small mb-0" x-show="!libraryStats.narratorsWithCount.length">No narrators yet.</p>
                    <template x-for="row in libraryStats.narratorsWithCount" :key="row.name">
                      <div>
                        <div class="stat-row-top">
                          <a class="text-truncate" :href="libraryFilter('narrators', row.name)" x-text="row.name"></a>
                          <span class="stat-row-value" x-text="countLabel(row.count, 'book')"></span>
                        </div>
                        <div class="stat-bar"><span :style="`width:${pct(row.count, libraryStats.narratorsWithCount, 'count')}%`"></span></div>
                      </div>
                    </template>
                  </div>
                </section>
              </div>
            </div>
          </template>
        </div>

        <div x-show="!loading && tab === 'you'">
          <template x-if="listening && !listening.totalTime">
            <div class="empty"><i class="bi bi-headphones"></i>No listening history yet. Time you spend playing books shows up here.</div>
          </template>
          <template x-if="listening && listening.totalTime">
            <div>
              <div class="stat-windows" role="tablist" aria-label="Listening period">
                <template x-for="w in windows" :key="w.id">
                  <button type="button" class="stat-window" :class="windowId === w.id && 'active'" :title="w.label" :aria-pressed="windowId === w.id" @click="windowId = w.id">
                    <span class="stat-window-label" x-text="w.short"></span>
                    <span class="stat-window-value" x-text="fmt.span(listening.windows[w.id].time)"></span>
                  </button>
                </template>
              </div>
              <div class="stat-cards">
                <div class="stat-card"><div class="k">Listened</div><div class="v" x-text="fmt.span(current().time)"></div></div>
                <div class="stat-card"><div class="k">Books</div><div class="v" x-text="current().booksListened"></div></div>
                <div class="stat-card"><div class="k">Finished</div><div class="v" x-text="current().booksFinished"></div></div>
              </div>
              <p class="text-muted" x-show="periodEmpty()">No listening in this period.</p>
              <div class="stat-grid" x-show="!periodEmpty()">
                <section class="panel">
                  <div class="panel-head"><h2 class="section-title">Books</h2></div>
                  <div class="panel-body stat-list">
                    <p class="text-muted small mb-0" x-show="!current().books.length">No books in this period.</p>
                    <template x-for="book in current().books" :key="book.id">
                      <div>
                        <div class="stat-row-top">
                          <a class="stat-book" :href="`#/item/${book.id}`">
                            <img x-show="book.coverPath" :src="cover(book.id)" alt="">
                            <span class="ph" x-show="!book.coverPath"><i class="bi bi-book"></i></span>
                            <span class="min-w-0">
                              <span class="d-block text-truncate" x-text="book.title"></span>
                              <span class="d-block text-truncate text-muted small" x-show="book.author" x-text="book.author"></span>
                            </span>
                          </a>
                          <span class="stat-row-value" x-text="fmt.duration(book.time)"></span>
                        </div>
                        <div class="stat-bar"><span :style="`width:${pct(book.time, current().books, 'time')}%`"></span></div>
                      </div>
                    </template>
                  </div>
                </section>
                <section class="panel">
                  <div class="panel-head"><h2 class="section-title">Genres</h2></div>
                  <div class="panel-body stat-list">
                    <p class="text-muted small mb-0" x-show="!current().genres.length">No genres in this period.</p>
                    <template x-for="row in current().genres" :key="row.genre">
                      <div>
                        <div class="stat-row-top">
                          <a class="text-truncate" :href="libraryFilter('genres', row.genre)" x-text="row.genre"></a>
                          <span class="stat-row-value" x-text="fmt.duration(row.time)"></span>
                        </div>
                        <div class="stat-bar"><span :style="`width:${pct(row.time, current().genres, 'time')}%`"></span></div>
                      </div>
                    </template>
                  </div>
                </section>
                <section class="panel">
                  <div class="panel-head"><h2 class="section-title">Authors</h2></div>
                  <div class="panel-body stat-list">
                    <p class="text-muted small mb-0" x-show="!current().authors.length">No authors in this period.</p>
                    <template x-for="row in current().authors" :key="row.name">
                      <div>
                        <div class="stat-row-top">
                          <a class="text-truncate" x-show="row.id" :href="`#/author/${row.id}`" x-text="row.name"></a>
                          <span class="text-truncate" x-show="!row.id" x-text="row.name"></span>
                          <span class="stat-row-value" x-text="fmt.duration(row.time)"></span>
                        </div>
                        <div class="stat-bar"><span :style="`width:${pct(row.time, current().authors, 'time')}%`"></span></div>
                      </div>
                    </template>
                  </div>
                </section>
                <section class="panel">
                  <div class="panel-head"><h2 class="section-title">Narrators</h2></div>
                  <div class="panel-body stat-list">
                    <p class="text-muted small mb-0" x-show="!current().narrators.length">No narrators in this period.</p>
                    <template x-for="row in current().narrators" :key="row.name">
                      <div>
                        <div class="stat-row-top">
                          <a class="text-truncate" :href="libraryFilter('narrators', row.name)" x-text="row.name"></a>
                          <span class="stat-row-value" x-text="fmt.duration(row.time)"></span>
                        </div>
                        <div class="stat-bar"><span :style="`width:${pct(row.time, current().narrators, 'time')}%`"></span></div>
                      </div>
                    </template>
                  </div>
                </section>
                <section class="panel">
                  <div class="panel-head"><h2 class="section-title">Days of the week</h2></div>
                  <div class="panel-body stat-list">
                    <template x-for="row in current().dayOfWeek" :key="row.day">
                      <div>
                        <div class="stat-row-top">
                          <span x-text="dayLabel(row.day)"></span>
                          <span class="stat-row-value" x-text="fmt.duration(row.time)"></span>
                        </div>
                        <div class="stat-bar"><span :style="`width:${pct(row.time, current().dayOfWeek, 'time')}%`"></span></div>
                      </div>
                    </template>
                  </div>
                </section>
              </div>
              <section class="panel mt-3" x-show="listening.recentSessions.length">
                <div class="panel-head"><h2 class="section-title">Recent sessions</h2></div>
                <div class="panel-body">
                  <template x-for="s in listening.recentSessions" :key="s.id">
                    <a class="stat-session" :href="`#/item/${s.libraryItemId}`">
                      <img x-show="s.coverPath" :src="cover(s.libraryItemId)" alt="">
                      <span class="ph" x-show="!s.coverPath"><i class="bi bi-book"></i></span>
                      <span class="min-w-0 flex-grow-1">
                        <span class="d-block text-truncate" x-text="s.displayTitle || 'Untitled'"></span>
                        <span class="d-block text-truncate text-muted small" x-text="s.displayAuthor"></span>
                      </span>
                      <span class="stat-row-value" x-text="fmt.duration(s.timeListening)"></span>
                      <span class="stat-row-value d-none d-sm-inline" x-text="fmt.date(s.updatedAt)"></span>
                    </a>
                  </template>
                </div>
              </section>
            </div>
          </template>
        </div>
      </div>
    </template>

    <!-- ============================================================ library -->
    <template x-if="$store.app.route.name === 'library' && $store.app.libraries.length">
      <div class="page" x-data="libraryView()">
        <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
          <h1 class="page-title me-3" x-text="$store.app.library ? $store.app.library.name : 'Library'"></h1>
          <div class="nav-tabs-ui mb-0 border-0">
            <button :class="tab === 'books' && 'active'" @click="setTab('books')">Books</button>
            <button :class="tab === 'series' && 'active'" @click="setTab('series')">Series</button>
            <button :class="tab === 'authors' && 'active'" @click="setTab('authors')">Authors</button>
            <button :class="tab === 'collections' && 'active'" @click="setTab('collections')">Collections</button>
          </div>
        </div>

        <div class="d-flex flex-wrap align-items-center gap-2 mb-3" x-show="tab === 'books'">
          <span class="text-muted small me-1" x-text="total + ' book' + (total === 1 ? '' : 's')"></span>
          <template x-if="q"><span class="chip chip-accent">Search: <span x-text="q"></span> <button class="btn btn-sm p-0 ms-1" style="color:inherit" @click="clearSearch()" aria-label="Clear"><i class="bi bi-x"></i></button></span></template>
          <template x-if="filter"><span class="chip chip-accent"><span x-text="filterLabel"></span> <button class="btn btn-sm p-0 ms-1" style="color:inherit" @click="setFilter()" aria-label="Clear filter"><i class="bi bi-x"></i></button></span></template>
          <div class="ms-auto d-flex gap-2 flex-wrap">
            <button class="btn btn-ghost btn-sm" :class="collapse && 'active'" @click="toggleCollapse()" :disabled="!!filter || !!q"><i class="bi bi-stack"></i> Collapse series</button>
            <div class="position-relative" @click.outside="menu === 'filter' && (menu = null)">
              <button class="btn btn-ghost btn-sm" @click="toggleFilterMenu()"><i class="bi bi-funnel"></i> Filter</button>
              <div class="menu" x-show="menu === 'filter'" x-cloak>
                <div class="menu-label">Progress</div>
                <button @click="setFilter('progress','in-progress','In progress')">In progress</button>
                <button @click="setFilter('progress','not-started','Not started')">Not started</button>
                <button @click="setFilter('progress','finished','Finished')">Finished</button>
                <button @click="setFilter('progress','not-finished','Not finished')">Not finished</button>
                <div class="menu-label">Missing</div>
                <template x-for="m in [['cover','Cover'],['description','Description'],['authors','Author'],['series','Series'],['narrators','Narrator'],['asin','ASIN'],['publishedYear','Year']]" :key="m[0]">
                  <button @click="setFilter('missing', m[0], 'Missing ' + m[1].toLowerCase())" x-text="'No ' + m[1].toLowerCase()"></button>
                </template>
                <button @click="setFilter('issues','issues','Has issues')">Has issues</button>
                <button @click="setFilter('ebooks','ebook','Has ebook')">Has ebook</button>
                <template x-if="filterData && filterData.genres.length">
                  <div><div class="menu-label">Genres</div>
                    <template x-for="g in filterData.genres" :key="g"><button @click="setFilter('genres', g, g)" x-text="g"></button></template></div>
                </template>
                <template x-if="filterData && filterData.narrators.length">
                  <div><div class="menu-label">Narrators</div>
                    <template x-for="n in filterData.narrators" :key="n"><button @click="setFilter('narrators', n, n)" x-text="n"></button></template></div>
                </template>
                <template x-if="filterData && filterData.tags.length">
                  <div><div class="menu-label">Tags</div>
                    <template x-for="t in filterData.tags" :key="t"><button @click="setFilter('tags', t, t)" x-text="t"></button></template></div>
                </template>
                <template x-if="filterData && filterData.languages.length">
                  <div><div class="menu-label">Languages</div>
                    <template x-for="l in filterData.languages" :key="l"><button @click="setFilter('languages', l, l)" x-text="l"></button></template></div>
                </template>
              </div>
            </div>
            <div class="position-relative" @click.outside="menu === 'sort' && (menu = null)">
              <button class="btn btn-ghost btn-sm" @click="menu = menu === 'sort' ? null : 'sort'"><i class="bi" :class="desc ? 'bi-sort-down' : 'bi-sort-up'"></i> <span x-text="sortLabel()"></span></button>
              <div class="menu" x-show="menu === 'sort'" x-cloak>
                <template x-for="s in sorts" :key="s[0]">
                  <button :class="sort === s[0] && 'active'" @click="setSort(s[0])"><span x-text="s[1]"></span><i class="bi ms-auto" x-show="sort === s[0]" :class="desc ? 'bi-arrow-down' : 'bi-arrow-up'"></i></button>
                </template>
              </div>
            </div>
            <template x-if="$store.app.canUpdate">
              <button class="btn btn-ghost btn-sm" :class="selectMode && 'active'" @click="selectMode = !selectMode; selected = []"><i class="bi bi-check2-square"></i> Select</button>
            </template>
          </div>
        </div>

        <div class="d-flex flex-wrap align-items-center gap-2 mb-3" x-show="tab === 'series'">
          <span class="text-muted small me-1" x-text="total + ' series'"></span>
          <div class="ms-auto position-relative" @click.outside="menu === 'seriesSort' && (menu = null)">
            <button class="btn btn-ghost btn-sm" @click="menu = menu === 'seriesSort' ? null : 'seriesSort'"><i class="bi" :class="seriesDesc ? 'bi-sort-down' : 'bi-sort-up'"></i> <span x-text="seriesSortLabel()"></span></button>
            <div class="menu" x-show="menu === 'seriesSort'" x-cloak>
              <template x-for="s in seriesSorts" :key="s[0]">
                <button :class="seriesSort === s[0] && 'active'" @click="setSeriesSort(s[0])"><span x-text="s[1]"></span><i class="bi ms-auto" x-show="seriesSort === s[0]" :class="seriesDesc ? 'bi-arrow-down' : 'bi-arrow-up'"></i></button>
              </template>
            </div>
          </div>
        </div>

        <template x-if="selectMode">
          <div class="panel mb-3"><div class="panel-body d-flex flex-wrap align-items-center gap-2">
            <span><strong x-text="selected.length"></strong> selected</span>
            <button class="btn btn-accent btn-sm ms-auto" :disabled="!selected.length" @click="quickMatchSelected()"><i class="bi bi-magic"></i> Quick match</button>
            <button class="btn btn-ghost btn-sm" @click="selected = items.filter(i => !i.collapsedSeries).map(i => i.id)">Select all loaded</button>
          </div></div>
        </template>

        <!-- books -->
        <template x-if="tab === 'books'">
          <div>
            <div class="book-grid" x-ref="booksGrid" x-show="!selectMode"></div>
            <template x-if="selectMode">
              <div class="book-grid">
                <template x-for="i in items.filter(i => !i.collapsedSeries)" :key="i.id">
                  <div class="book-card" @click="toggleSelect(i.id)" role="checkbox" :aria-checked="selected.includes(i.id)">
                    <div class="cover" :style="selected.includes(i.id) ? 'border-color: var(--accent); border-width: 3px' : ''">
                      <img x-show="i.media.coverPath" :src="$store.app.cover(i, true)" alt="" loading="lazy" decoding="async">
                      <div class="cover-ph" x-show="!i.media.coverPath" x-text="i.media.metadata.title"></div>
                      <span class="badge-done" x-show="selected.includes(i.id)" style="background:var(--accent);color:var(--accent-ink)"><i class="bi bi-check-lg"></i></span>
                    </div>
                    <div class="book-meta"><div class="book-title" x-text="i.media.metadata.title"></div></div>
                  </div>
                </template>
              </div>
            </template>
            <template x-if="!loading && done && !items.length"><div class="empty"><i class="bi bi-search"></i>No books match.</div></template>
          </div>
        </template>
        <template x-if="tab === 'series'">
          <div>
            <div class="book-grid" x-ref="seriesGrid"></div>
            <template x-if="!loading && done && !series.length"><div class="empty"><i class="bi bi-collection"></i>No series found.</div></template>
          </div>
        </template>
        <template x-if="tab === 'authors'">
          <div>
            <div class="book-grid" x-ref="authorsGrid"></div>
            <template x-if="!loading && done && !authors.length"><div class="empty"><i class="bi bi-people"></i>No authors found.</div></template>
          </div>
        </template>
        <template x-if="tab === 'collections'">
          <div>
            <template x-for="c in collections" :key="c.id">
              <section class="mb-4">
                <div class="d-flex align-items-center justify-content-between mb-2">
                  <h2 class="section-title" x-text="c.name"></h2>
                  <span class="text-muted small" x-text="c.books.length + ' books'"></span>
                </div>
                <p class="text-muted small" x-show="c.description" x-text="c.description"></p>
                <div class="shelf" x-html="c.books.map(b => bookCard(b)).join('')"></div>
              </section>
            </template>
            <template x-if="!loading && done && !collections.length"><div class="empty"><i class="bi bi-bookmark-star"></i>No collections yet. Add books to a collection from a book's page.</div></template>
          </div>
        </template>
        <div x-ref="sentinel" class="py-4 text-center"><div class="spinner-border spinner-border-sm" x-show="loading"></div></div>
      </div>
    </template>

    <!-- ============================================================ item -->
    <template x-if="$store.app.route.name === 'item'">
      <div class="page" x-data="itemView()">
        <div x-show="loading" class="py-5 text-center"><div class="spinner-border"></div></div>
        <template x-if="item">
          <div>
            <div class="row g-4">
              <div class="col-md-4 col-lg-3">
                <div class="detail-cover mx-auto">
                  <img x-show="item.media.coverPath" :src="$store.app.cover(item)" alt="Cover">
                  <div class="cover-ph h-100 d-grid p-3" style="place-items:center;text-align:center" x-show="!item.media.coverPath" x-text="md.title"></div>
                </div>
                <template x-if="progress">
                  <div class="mt-3">
                    <div class="d-flex justify-content-between small mb-1">
                      <span class="text-muted" x-text="progress.isFinished ? 'Finished' : 'Progress'"></span>
                      <span x-text="progress.isFinished ? fmt.date(progress.finishedAt) : pct + '% · ' + fmt.duration(item.media.duration - progress.currentTime) + ' left'"></span>
                    </div>
                    <div class="bar"><span :style="`width:${pct}%`"></span></div>
                  </div>
                </template>
              </div>
              <div class="col-md-8 col-lg-9">
                <div class="d-flex flex-wrap gap-2 mb-2">
                  <template x-for="s in md.series" :key="s.id">
                    <a class="chip chip-accent" :href="`#/series/${s.id}`"><i class="bi bi-collection"></i> <span x-text="s.name + (s.sequence ? ' #' + s.sequence : '')"></span></a>
                  </template>
                  <span class="chip chip-danger" x-show="item.isMissing">Missing from disk</span>
                  <span class="chip chip-lock" x-show="item.locked" :title="item.lockReason"><i class="bi bi-lock-fill"></i> Locked</span>
                  <span class="chip" x-show="md.explicit">Explicit</span>
                  <span class="chip" x-show="md.abridged">Abridged</span>
                </div>
                <h1 class="detail-title" x-text="md.title"></h1>
                <p class="h5 text-muted fw-normal mb-2" x-show="md.subtitle" x-text="md.subtitle"></p>
                <p class="mb-3">
                  <span class="text-muted">by </span>
                  <template x-for="(a, idx) in md.authors" :key="a.id"><span><a :href="`#/author/${a.id}`" x-text="a.name"></a><span x-show="idx < md.authors.length - 1">, </span></span></template>
                  <span x-show="!md.authors.length" class="text-muted">Unknown author</span>
                </p>

                <div class="d-flex flex-wrap gap-2 mb-4">
                  <button class="btn btn-accent" @click="play()" x-show="item.media.numTracks" :disabled="$store.player.loading">
                    <i class="bi bi-play-fill"></i> <span x-text="progress && !progress.isFinished && progress.currentTime > 0 ? 'Resume' : 'Play'"></span>
                  </button>
                  <button class="btn btn-ghost" @click="setFinished(!(progress && progress.isFinished))">
                    <i class="bi" :class="progress && progress.isFinished ? 'bi-arrow-counterclockwise' : 'bi-check2-circle'"></i>
                    <span x-text="progress && progress.isFinished ? 'Mark unfinished' : 'Mark finished'"></span>
                  </button>
                  <template x-if="$store.app.canUpdate"><button class="btn btn-ghost" @click="edit()"><i class="bi bi-pencil"></i> Edit</button></template>
                  <template x-if="$store.app.canUpdate"><button class="btn btn-ghost" @click="edit('match')"><i class="bi bi-search"></i> Match</button></template>
                  <div class="position-relative" x-data="{ open: false }" @click.outside="open = false">
                    <button class="btn btn-ghost btn-icon" @click="open = !open" aria-label="More"><i class="bi bi-three-dots"></i></button>
                    <div class="menu" x-show="open" x-cloak @click="open = false">
                      <template x-if="$store.app.canUpdate"><button @click="quickMatch()"><i class="bi bi-magic"></i> Quick match</button></template>
                      <template x-if="$store.app.isAdmin"><button @click="organize()"><i class="bi bi-folder-symlink"></i> Rename folder</button></template>
                      <template x-if="$store.app.isAdmin"><button @click="rescan()"><i class="bi bi-arrow-repeat"></i> Rescan files</button></template>
                      <button @click="$store.app.modal = { type: 'collection', item }"><i class="bi bi-bookmark-plus"></i> Add to collection</button>
                      <button @click="download()"><i class="bi bi-download"></i> Download</button>
                      <button x-show="progress" @click="resetProgress()"><i class="bi bi-x-circle"></i> Discard progress</button>
                      <template x-if="$store.app.canDelete"><button @click="remove(false)"><i class="bi bi-trash"></i> Remove from library</button></template>
                      <template x-if="$store.app.canDelete && !item.locked"><button @click="remove(true)" style="color:var(--danger)"><i class="bi bi-trash3-fill"></i> Delete files</button></template>
                      <template x-if="$store.app.canDelete && item.locked"><button disabled :title="item.lockReason" style="opacity:.6"><i class="bi bi-lock-fill"></i> Delete files (locked)</button></template>
                    </div>
                  </div>
                </div>

                <dl class="meta-grid mb-4">
                  <template x-if="md.narrators.length"><dt>Narrated by</dt></template>
                  <template x-if="md.narrators.length"><dd x-text="md.narrators.join(', ')"></dd></template>
                  <dt>Duration</dt><dd x-text="fmt.duration(item.media.duration) + (item.media.numTracks > 1 ? ` · ${item.media.numTracks} files` : '')"></dd>
                  <template x-if="md.publishedYear"><dt>Published</dt></template>
                  <template x-if="md.publishedYear"><dd x-text="md.publishedYear + (md.publisher ? ' · ' + md.publisher : '')"></dd></template>
                  <template x-if="md.genres.length"><dt>Genres</dt></template>
                  <template x-if="md.genres.length"><dd class="d-flex flex-wrap gap-1">
                    <template x-for="g in md.genres" :key="g"><a class="chip" :href="`#/library/${item.libraryId}?tab=books&filter=genres.${encodeURIComponent(fmt.b64(g))}&label=${encodeURIComponent(g)}`" x-text="g"></a></template>
                  </dd></template>
                  <template x-if="item.media.tags.length"><dt>Tags</dt></template>
                  <template x-if="item.media.tags.length"><dd class="d-flex flex-wrap gap-1"><template x-for="t in item.media.tags" :key="t"><span class="chip" x-text="t"></span></template></dd></template>
                  <template x-if="md.language"><dt>Language</dt></template>
                  <template x-if="md.language"><dd x-text="md.language"></dd></template>
                  <template x-if="md.asin || md.isbn"><dt>Identifiers</dt></template>
                  <template x-if="md.asin || md.isbn"><dd class="mono" x-text="[md.asin && 'ASIN ' + md.asin, md.isbn && 'ISBN ' + md.isbn].filter(Boolean).join(' · ')"></dd></template>
                  <dt>Size</dt><dd x-text="fmt.size(item.size)"></dd>
                  <template x-if="$store.app.isAdmin"><dt>Path</dt></template>
                  <template x-if="$store.app.isAdmin"><dd class="mono" x-text="item.path"></dd></template>
                </dl>

                <template x-if="md.description">
                  <div class="mb-4">
                    <div class="description" :class="!expanded && md.descriptionPlain.length > 600 && 'clamped'" x-text="md.descriptionPlain"></div>
                    <button class="btn btn-link px-0" x-show="md.descriptionPlain.length > 600" @click="expanded = !expanded" x-text="expanded ? 'Show less' : 'Read more'"></button>
                  </div>
                </template>

                <div class="nav-tabs-ui">
                  <button :class="tab === 'chapters' && 'active'" @click="tab = 'chapters'">Chapters <span class="text-muted" x-text="`(${item.media.chapters.length})`"></span></button>
                  <button :class="tab === 'files' && 'active'" @click="tab = 'files'">Files <span class="text-muted" x-text="`(${item.libraryFiles.length})`"></span></button>
                </div>
                <template x-if="tab === 'chapters'">
                  <div class="panel">
                    <table class="table table-dark-ui table-hover">
                      <thead><tr><th style="width:50px">#</th><th>Title</th><th class="text-end">Start</th><th class="text-end d-none d-sm-table-cell">Length</th></tr></thead>
                      <tbody>
                        <template x-for="(c, idx) in item.media.chapters" :key="idx">
                          <tr class="chapter-row" :class="currentChapter === idx && 'current'" style="cursor:pointer" @click="play(c.start)">
                            <td class="text-muted" x-text="idx + 1"></td><td x-text="c.title"></td>
                            <td class="text-end mono" x-text="fmt.clock(c.start)"></td>
                            <td class="text-end mono d-none d-sm-table-cell" x-text="fmt.clock(c.end - c.start)"></td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                    <div class="p-3 text-muted" x-show="!item.media.chapters.length">No chapters.</div>
                  </div>
                </template>
                <template x-if="tab === 'files'">
                  <div class="panel table-responsive">
                    <table class="table table-dark-ui">
                      <thead><tr><th>File</th><th class="d-none d-md-table-cell">Format</th><th class="text-end">Duration</th><th class="text-end">Size</th></tr></thead>
                      <tbody>
                        <template x-for="f in item.media.audioFiles" :key="f.ino">
                          <tr :style="f.exclude ? 'opacity:.6' : ''">
                            <td><span class="mono" x-text="f.metadata.relPath"></span> <span class="chip" x-show="f.exclude">excluded</span></td>
                            <td class="d-none d-md-table-cell text-muted" x-text="[f.codec, f.bitRate ? Math.round(f.bitRate / 1000) + ' kbps' : '', f.channelLayout].filter(Boolean).join(' · ')"></td>
                            <td class="text-end mono" x-text="fmt.clock(f.duration)"></td>
                            <td class="text-end" x-text="fmt.size(f.metadata.size)"></td>
                          </tr>
                        </template>
                        <template x-for="f in item.libraryFiles.filter(f => f.fileType !== 'audio')" :key="f.ino">
                          <tr><td><span class="mono" x-text="f.metadata.relPath"></span> <span class="chip" x-text="f.fileType"></span></td><td class="d-none d-md-table-cell"></td><td></td><td class="text-end" x-text="fmt.size(f.metadata.size)"></td></tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </template>
      </div>
    </template>

    <!-- ============================================================ series -->
    <template x-if="$store.app.route.name === 'series'">
      <div class="page" x-data="seriesView()">
        <div x-show="loading" class="py-5 text-center"><div class="spinner-border"></div></div>
        <template x-if="series">
          <div>
            <div class="d-flex flex-wrap align-items-center gap-3 mb-4">
              <div>
                <div class="text-muted small text-uppercase fw-semibold" style="letter-spacing:.08em">Series</div>
                <h1 class="page-title" x-show="!editing" x-text="series.name"></h1>
                <form x-show="editing" class="d-flex gap-2" @submit.prevent="save()"><input class="form-control" x-model="name"><button class="btn btn-accent">Save</button><button type="button" class="btn btn-ghost" @click="editing = false">Cancel</button></form>
                <div class="text-muted" x-text="`${series.books.length} books · ${fmt.duration(series.totalDuration)}`"></div>
              </div>
              <div class="ms-auto d-flex gap-2">
                <button class="btn btn-accent" @click="playNext()"><i class="bi bi-play-fill"></i> Play next unfinished</button>
                <button class="btn btn-ghost" @click="setFinished(!(series.progress && series.progress.isFinished))" :disabled="finishing || !series.books.length">
                  <i class="bi" :class="series.progress && series.progress.isFinished ? 'bi-arrow-counterclockwise' : 'bi-check2-circle'"></i>
                  <span x-text="series.progress && series.progress.isFinished ? 'Mark unfinished' : 'Mark series finished'"></span>
                </button>
                <template x-if="$store.app.isAdmin"><button class="btn btn-ghost" @click="matchSeries()"><i class="bi bi-magic"></i> Match series</button></template>
                <template x-if="$store.app.canUpdate"><button class="btn btn-ghost" @click="editing = true"><i class="bi bi-pencil"></i> Rename</button></template>
              </div>
            </div>
            <div class="book-grid" x-html="series.books.map(b => bookCard(b, { sequence: b.sequence })).join('')"></div>
          </div>
        </template>
      </div>
    </template>

    <!-- ============================================================ author -->
    <template x-if="$store.app.route.name === 'author'">
      <div class="page" x-data="authorView()">
        <div x-show="loading" class="py-5 text-center"><div class="spinner-border"></div></div>
        <template x-if="author">
          <div>
            <div class="row g-4 mb-4">
              <div class="col-auto"><div class="avatar" style="width:160px">
                <img x-show="image()" :src="image()" alt=""><span x-show="!image()" x-text="author.name.split(/\s+/).map(w => w[0]).slice(0,2).join('')"></span>
              </div></div>

                <div class="text-muted small text-uppercase fw-semibold" style="letter-spacing:.08em">Author</div>
                <h1 class="page-title mb-1" x-text="author.name"></h1>
                <div class="text-muted mb-3" x-text="`${author.libraryItems.length} books` + (author.asin ? ' · ASIN ' + author.asin : '')"></div>

                <button class="btn btn-link px-0" x-show="(author.description || '').length > 500" @click="expanded = !expanded" x-text="expanded ? 'Show less' : 'Read more'"></button>
                <template x-if="$store.app.canUpdate">
                  <div class="d-flex gap-2 mt-2">
                    <button class="btn btn-ghost btn-sm" @click="match()" :disabled="matching"><span class="spinner-border spinner-border-sm me-1" x-show="matching"></span><i class="bi bi-search" x-show="!matching"></i> Fetch info from Audible</button>

                    <div class="row g-2">
                      <div class="col-md-8"><label class="form-label">Name</label><input class="form-control" x-model="form.name"></div>
                      <div class="col-md-4"><label class="form-label">ASIN</label><input class="form-control mono" x-model="form.asin"></div>
                      <div class="col-12"><label class="form-label">Description</label><textarea class="form-control" rows="4" x-model="form.description"></textarea></div>

                    <button class="btn btn-accent btn-sm">Save</button>
                  </div></form>
                </template>

              <section class="mb-4">
                <div class="d-flex align-items-center justify-content-between mb-2">
                  <h2 class="section-title"><a :href="`#/series/${s.id}`" style="color:var(--text)" x-text="s.name"></a></h2>
                  <span class="text-muted small" x-text="s.items.length + ' books'"></span>
                </div>
                <div class="shelf" x-html="s.items.map(b => bookCard(b)).join('')"></div>
              </section>
            </template>
            <template x-if="standalone.length">
              <section class="mb-4">
                <h2 class="section-title mb-2" x-text="author.series.length ? 'Other books' : 'Books'"></h2>
                <div class="book-grid" x-html="standalone.map(b => bookCard(b)).join('')"></div>
              </section>
            </template>
          </div>
        </template>
      </div>
    </template>

    <!-- ============================================================ import -->
    <template x-if="$store.app.route.name === 'import' && $store.app.isAdmin && $store.app.libraries.length">
      <div class="page" x-data="importView()">
        <div class="d-flex flex-wrap align-items-center gap-2 mb-1">
          <h1 class="page-title me-auto">Import</h1>
          <select class="form-select form-select-sm w-auto" x-model="libId" @change="load()">
            <template x-for="l in $store.app.libraries" :key="l.id"><option :value="l.id" x-text="l.name" :selected="l.id === libId"></option></template>
          </select>
          <select class="form-select form-select-sm w-auto" x-model="filter" aria-label="Show">
            <option value="pending">Not imported</option>
            <option value="review">Needs review</option>
            <option value="imported">Already imported</option>
            <option value="skipped">Already in the library</option>
            <option value="all">All</option>
          </select>
          <select class="form-select form-select-sm w-auto" x-model="mode" aria-label="Import mode">
            <option value="move">Move files</option><option value="copy">Copy files</option>
          </select>
          <button class="btn btn-ghost btn-sm" @click="load(true)"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
          <button type="button" class="btn btn-accent btn-sm" :disabled="!importableCandidates.length || batching" @click="importAll()">
            <span class="spinner-border spinner-border-sm me-1" style="color:inherit" x-show="batching"></span>
            <span x-text="importableCandidates.length ? 'Import all shown (' + importableCandidates.length + ')' : 'Import all shown'"></span>
          </button>
          <button type="button" class="btn btn-ghost btn-sm" x-show="lib && lib.settings.autoImport" @click="runAutoImport()"><i class="bi bi-magic"></i> Run auto-import</button>
        </div>
        <div class="small mb-2" x-show="lib && lib.settings.autoImport"><span class="chip chip-success"><i class="bi bi-magic"></i> Auto-import on</span>
          <span class="text-muted" x-text="'Confident matches are ' + (lib && lib.settings.importMode === 'copy' ? 'copied' : 'moved') + ' into the library automatically.'"></span></div>
        <p class="text-muted mb-4">Books found in <span class="mono" x-text="importFolder || '(not set)'"></span> are matched, then moved into the library <span x-text="lib && lib.settings.organizeOnImport === false ? 'keeping their current folder names' : 'as'"></span> <span class="mono" x-show="!(lib && lib.settings.organizeOnImport === false)" x-text="template"></span>.</p>

        <template x-if="stale && !loading">
          <div class="panel mb-3" style="border-color:var(--accent)"><div class="panel-body d-flex flex-wrap align-items-center gap-2">
            <i class="bi bi-bell" style="color:var(--accent)"></i>
            <span>The import folder changed (<span x-text="stale"></span> item<span x-show="stale !== 1">s</span> now). Refreshing clears unsaved edits below.</span>
            <button type="button" class="btn btn-accent btn-sm ms-auto" @click="load(true)"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
          </div></div>
        </template>
        <div x-show="loading" class="py-5 text-center"><div class="spinner-border"></div><div class="text-muted mt-2">Reading files…</div></div>
        <template x-if="!loading && error">
          <div class="empty"><i class="bi bi-folder-x"></i><span x-text="error"></span>. <a :href="`#/settings/libraries`">Set an import folder</a> in the library settings.</div>
        </template>
        <template x-if="!loading && !error && !candidates.length">
          <div class="empty"><i class="bi bi-inbox"></i>Nothing to import. Drop book folders or single audio files into the import folder.</div>
        </template>
        <template x-if="!loading && !error && filter === 'pending' && skippedCandidates.length">
          <div class="panel mb-3"><div class="panel-body d-flex flex-wrap align-items-center gap-2">
            <i class="bi bi-check2-circle"></i>
            <span x-text="skippedCandidates.length + (skippedCandidates.length === 1 ? ' book is' : ' books are') + ' already in the library, so nothing was copied over those folders. The import copies were left where they are.'"></span>
            <button type="button" class="btn btn-ghost btn-sm ms-auto" @click="filter = 'skipped'">Show them</button>
          </div></div>
        </template>
        <template x-if="!loading && !error && candidates.length && filter === 'pending' && !visibleCandidates.length">
          <div class="empty"><i class="bi bi-check2-circle"></i>Nothing left to import. The other books are already imported or already in the library.</div>
        </template>

        <template x-for="c in visibleCandidates" :key="c.id">
          <div class="panel mb-3">
            <div class="panel-head">
              <div class="min-w-0">
                <div class="mono text-truncate" x-text="c.relPath"></div>
                <div class="small text-muted" x-text="`${c.numAudioFiles} audio file${c.numAudioFiles === 1 ? '' : 's'} · ${fmt.duration(c.duration)} · ${fmt.size(c.size)}` + (c.hasCover ? ' · has cover' : '')"></div>
                <div class="small mt-1" x-show="c.autoImport && c.autoImport.status === 'review'"><span class="chip chip-warning">Needs review</span> <span x-text="c.autoImport && c.autoImport.reason"></span></div>
                <div class="small mt-1 d-flex flex-wrap align-items-center gap-2" x-show="c.autoImport && c.autoImport.suggestion">
                  <span class="text-muted" x-text="'Closest match: ' + suggestionLabel(c)"></span>
                  <button type="button" class="btn btn-ghost btn-sm" @click="useSuggestion(c)">Use this match</button>
                </div>
                <div class="small mt-1" x-show="c.autoImport && c.autoImport.status === 'imported'"><span class="chip chip-success">Already imported</span> <span class="mono" x-text="c.autoImport && c.autoImport.to"></span> <span class="text-muted">(the originals were copied, so they're still here)</span></div>
                <div class="small mt-1" x-show="c.autoImport && c.autoImport.status === 'skipped'"><span class="chip">Already in the library</span> <span x-text="c.autoImport && c.autoImport.reason"></span> <span class="text-muted">Change the title or author below to import this as a separate copy.</span></div>
                <div class="small mt-1 text-danger" x-show="c.error" x-text="c.error"></div>
              </div>
              <button class="btn btn-ghost btn-sm" @click="openSearch(c)"><i class="bi bi-search"></i> Find metadata</button>
            </div>
            <div class="panel-body">
              <div class="row g-3">
                <template x-if="c.coverUrl">
                  <div class="col-lg-2 col-md-3 d-none d-md-block">
                    <div class="cover"><img :src="c.coverUrl" alt="Cover to use"></div>
                  </div>
                </template>
                <div class="col">
                  <div class="row g-2">
                    <div class="col-md-6"><label class="form-label">Title</label><input class="form-control" x-model="c.form.title"></div>
                    <div class="col-md-6"><label class="form-label">Author(s)</label><input class="form-control" x-model="c.form.authors" placeholder="Name & Name"></div>
                    <div class="col-md-5"><label class="form-label">Series</label><input class="form-control" x-model="c.form.series"></div>
                    <div class="col-md-2"><label class="form-label">Sequence</label><input class="form-control" x-model="c.form.sequence"></div>
                    <div class="col-md-5"><label class="form-label">Narrator(s)</label><input class="form-control" x-model="c.form.narrators"></div>
                    <div class="col-md-4"><label class="form-label">Subtitle</label><input class="form-control" x-model="c.form.subtitle"></div>
                    <div class="col-md-2"><label class="form-label">Year</label><input class="form-control" x-model="c.form.publishedYear"></div>
                    <div class="col-md-3"><label class="form-label">ASIN</label><input class="form-control mono" x-model="c.form.asin"></div>
                    <div class="col-md-3"><label class="form-label">Genres</label><input class="form-control" x-model="c.form.genres"></div>
                  </div>
                  <div class="d-flex flex-wrap align-items-center gap-2 mt-3">
                    <i class="bi bi-arrow-right path-arrow"></i>
                    <span class="mono" x-text="target(c)"></span>
                    <button class="btn btn-accent btn-sm ms-auto" :disabled="c.busy || !c.form.title" @click="doImport(c)">
                      <span class="spinner-border spinner-border-sm me-1" style="color:inherit" x-show="c.busy"></span><i class="bi bi-box-arrow-in-down" x-show="!c.busy"></i> Import
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </template>

        <!-- provider search modal -->
        <template x-if="active">
          <div class="ui-modal">
            <div class="backdrop" @click="active = null"></div>
            <div class="modal-content">
              <div class="modal-header"><h2 class="h5 m-0">Find metadata</h2><button type="button" class="btn-close" data-dismiss @click="active = null" aria-label="Close"></button></div>
              <div class="modal-body">
                <form class="row g-2 mb-3" @submit.prevent="search()">
                  <div class="col-md-3"><select class="form-select" x-model="provider"><template x-for="p in providers" :key="p.value"><option :value="p.value" x-text="p.text" :selected="p.value === provider"></option></template></select></div>
                  <div class="col-md-4"><input class="form-control" x-model="active.form.title" placeholder="Title or ASIN"></div>
                  <div class="col-md-3"><input class="form-control" x-model="active.form.authors" placeholder="Author"></div>
                  <div class="col-md-2 d-grid"><button class="btn btn-accent" :disabled="searching">Search</button></div>
                </form>
                <div x-show="searching" class="py-4 text-center"><div class="spinner-border"></div></div>
                <div class="d-grid gap-2">
                  <template x-for="(r, idx) in results" :key="idx">
                    <div class="match-result" @click="pick(r)">
                      <img :src="r.cover || ''" alt="" x-show="r.cover">
                      <div class="min-w-0">
                        <div class="fw-semibold" x-text="r.title + (r.subtitle ? ': ' + r.subtitle : '')"></div>
                        <div class="small text-muted" x-text="[r.author, r.narrator && 'Narr. ' + r.narrator, r.publishedYear].filter(Boolean).join(' · ')"></div>
                        <div class="small" x-show="r.series && r.series.length"><span class="chip chip-accent mt-1" x-text="(r.series || []).map(s => s.series + (s.sequence ? ' #' + s.sequence : '')).join(', ')"></span></div>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
            </div>
          </div>
        </template>
      </div>
    </template>

    <!-- ============================================================ organize -->
    <template x-if="$store.app.route.name === 'organize' && $store.app.isAdmin && $store.app.libraries.length">
      <div class="page" x-data="organizeView()">
        <div class="d-flex flex-wrap align-items-center gap-2 mb-1">
          <h1 class="page-title me-auto">Organize</h1>
          <select class="form-select form-select-sm w-auto" x-model="libId" @change="resetTemplate(); preview()">
            <template x-for="l in $store.app.libraries" :key="l.id"><option :value="l.id" x-text="l.name" :selected="l.id === libId"></option></template>
          </select>
        </div>
        <p class="text-muted mb-3">Rename book folders on disk to match their metadata. Review the plan before applying.</p>
        <div class="panel mb-3"><div class="panel-body">
          <label class="form-label">Folder template</label>
          <div class="d-flex flex-wrap gap-2">
            <input class="form-control mono flex-grow-1" style="min-width:240px" x-model="template" @keydown.enter.prevent="preview()">
            <button class="btn btn-ghost" @click="preview()" :disabled="loading"><i class="bi bi-eye"></i> Preview</button>
            <button class="btn btn-ghost" @click="saveTemplate()"><i class="bi bi-save"></i> Save as default</button>
          </div>
          <div class="form-text">Tokens: <span class="mono">{author} {series} {sequence} {title} {subtitle} {year} {narrator} {asin}</span>. Text in <span class="mono">[ ]</span> is dropped when a token inside is empty.</div>
        </div></div>

        <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
          <span><strong x-text="okCount"></strong> folder(s) to rename<span x-show="staleCount">, <strong x-text="staleCount"></strong> leftover</span><span class="text-muted" x-show="skippedCount > 0" x-text="`, ${skippedCount} not renamed`"></span></span>
          <label class="form-check form-switch ms-3 mb-0"><input class="form-check-input" type="checkbox" x-model="showAll" @change="preview()"> <span class="form-check-label small">Show unchanged</span></label>
          <button class="btn btn-accent ms-auto" :disabled="!selected.length || running" @click="apply()">
            <span class="spinner-border spinner-border-sm me-1" style="color:inherit" x-show="running"></span>
            Apply to <span x-text="selected.length"></span> selected
          </button>
        </div>
        <div x-show="loading" class="py-5 text-center"><div class="spinner-border"></div><div class="text-muted mt-2">Checking folders…</div></div>
        <div class="panel table-responsive" x-show="!loading && plans.length">
          <table class="table table-dark-ui">
            <thead><tr>
              <th style="width:36px"><input class="form-check-input" type="checkbox" :checked="selected.length && selected.length === actionableCount" @change="toggleAll($event.target.checked)" aria-label="Select all"></th>
              <th>Current</th><th></th><th>New</th><th>Status</th>
            </tr></thead>
            <tbody>
              <template x-for="p in plans" :key="p.id">
                <tr>
                  <td><input class="form-check-input" type="checkbox" :disabled="!actionable(p)" :value="p.id" x-model="selected" aria-label="Select"></td>
                  <td class="mono small" x-text="p.from"></td>
                  <td class="path-arrow"><i class="bi bi-arrow-right"></i></td>
                  <td class="mono small" x-text="p.to"></td>
                  <td>
                    <div class="small fw-semibold" :class="`status-${p.status}`" x-text="statusLabel(p)"></div>
                    <div class="small text-muted" x-show="p.detail" x-text="p.detail"></div>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
        <template x-if="!loading && !plans.length"><div class="empty"><i class="bi bi-check2-all"></i>Every folder already matches the template.</div></template>
      </div>
    </template>

    <!-- ============================================================ duplicates -->
    <template x-if="$store.app.route.name === 'duplicates' && $store.app.isAdmin">
      <div class="page" x-data="duplicatesView()">
        <div class="d-flex flex-wrap align-items-center gap-2 mb-1">
          <h1 class="page-title me-auto">Duplicates</h1>
          <button type="button" class="btn btn-ghost btn-sm" @click="load()" :disabled="loading"><i class="bi bi-arrow-clockwise"></i> Check again</button>
        </div>
        <p class="text-muted mb-3">Books that share an ASIN, or the same title and author, across all libraries. Each group has a recommendation based on audio quality, length, chapters and metadata; the reasons are listed on every copy.</p>

        <template x-if="!loading && groups.length">
          <div class="panel mb-3"><div class="panel-body d-flex flex-wrap align-items-center gap-2">
            <span><strong x-text="selectedGroups().length"></strong> of <span x-text="groups.length"></span> groups have a copy selected</span>
            <div class="ms-auto d-flex flex-wrap gap-2">
              <button type="button" class="btn btn-ghost btn-sm" @click="selectRecommended(false)"><i class="bi bi-stars"></i> Select recommendations</button>
              <button type="button" class="btn btn-ghost btn-sm" x-show="selectedGroups().length" @click="keep = {}">Clear</button>
              <button type="button" class="btn btn-accent btn-sm" :disabled="!selectedGroups().length || batchBusy" @click="resolveSelected()">
                <span class="spinner-border spinner-border-sm me-1" style="color:inherit" x-show="batchBusy"></span>Resolve selected
              </button>
            </div>
          </div></div>
        </template>

        <div x-show="loading" class="py-5 text-center"><div class="spinner-border"></div><div class="text-muted mt-2">Comparing copies…</div></div>
        <template x-if="!loading && !groups.length">
          <div class="empty"><i class="bi bi-check2-all"></i>No duplicates found.</div>
        </template>

        <template x-for="g in groups" :key="g.key">
          <div class="panel mb-3">
            <div class="panel-head">
              <div class="min-w-0">
                <div class="fw-semibold text-truncate" x-text="g.items[0].title"></div>
                <div class="d-flex flex-wrap gap-1 mt-1">
                  <template x-for="r in g.reasons" :key="r"><span class="chip chip-accent" x-text="r"></span></template>
                  <span class="chip" x-text="g.items.length + ' copies'"></span>
                  <span class="chip chip-success" x-show="g.identicalAudio">Identical audio</span>
                  <span class="chip" x-show="g.audibleLength" x-text="'Audible length ' + fmt.duration(g.audibleLength)"></span>
                </div>
              </div>
              <div class="d-flex flex-wrap gap-2">
                <button type="button" class="btn btn-ghost btn-sm" @click="notDuplicates(g)"><i class="bi bi-eye-slash"></i> Not duplicates</button>
                <button type="button" class="btn btn-accent btn-sm" :disabled="!keep[g.key] || busyKey === g.key || !!lockBlock(g)" :title="lockBlock(g) || ''" @click="openResolve(g)">
                  <span class="spinner-border spinner-border-sm me-1" style="color:inherit" x-show="busyKey === g.key"></span>Resolve…
                </button>
              </div>
            </div>
            <div class="panel-body">
              <template x-if="lockBlock(g)">
                <div class="dup-lock-warning mb-3"><i class="bi bi-lock-fill"></i> <span x-text="lockBlock(g)"></span></div>
              </template>
              <template x-if="g.recommendation">
                <div class="dup-reco mb-3">
                  <i class="bi" :class="g.recommendation.confident ? 'bi-stars' : 'bi-question-circle'"></i>
                  <div class="flex-grow-1 min-w-0">
                    <div x-text="g.recommendation.reason"></div>
                    <div class="mt-2 dup-alt" x-show="g.recommendation.alternative">
                      <span x-text="g.recommendation.alternative"></span>
                      <button type="button" class="btn btn-ghost btn-sm ms-1 mt-1" :disabled="busyKey === g.key" @click="applyFix(g)"><i class="bi bi-wrench"></i> Exclude duplicate track</button>
                    </div>
                  </div>
                  <button type="button" class="btn btn-sm text-nowrap" :class="keep[g.key] === g.recommendation.id ? 'btn-ghost active' : 'btn-accent'"
                          @click="keep[g.key] = g.recommendation.id" x-text="keep[g.key] === g.recommendation.id ? 'Selected' : 'Use recommendation'"></button>
                </div>
              </template>
              <div class="dup-copies">
                <template x-for="c in g.items" :key="c.id">
                  <label class="dup-copy" :class="keep[g.key] === c.id && 'selected'">
                    <div class="d-flex gap-3">
                      <div class="dup-cover">
                        <img x-show="c.hasCover" :src="cover(c)" alt="" loading="lazy">
                        <i class="bi bi-book" x-show="!c.hasCover"></i>
                      </div>
                      <div class="min-w-0 flex-grow-1">
                        <div class="d-flex align-items-center gap-2 flex-wrap">
                          <input class="form-check-input mt-0" type="radio" :name="'keep-' + g.key" :value="c.id" x-model="keep[g.key]">
                          <span class="fw-semibold" x-text="keep[g.key] === c.id ? 'Keep this copy' : (keep[g.key] ? 'Discard' : 'Keep this copy?')"></span>
                          <span class="chip chip-success" x-show="g.recommendation && g.recommendation.id === c.id"><i class="bi bi-stars"></i> Recommended</span>
                          <span class="chip chip-lock" x-show="c.locked"><i class="bi bi-lock-fill"></i> Locked</span>
                        </div>
                        <div class="small mt-1 text-truncate" x-text="[c.authorName, c.seriesName].filter(Boolean).join(' · ')"></div>
                        <div class="small text-muted" x-text="c.narrators.length ? 'Narrated by ' + c.narrators.join(', ') : ''"></div>
                      </div>
                    </div>
                    <div class="dup-folder mt-2"><i class="bi bi-hdd"></i> <span class="mono" x-text="c.folderPath || c.libraryName"></span></div>
                    <div class="mono small dup-path" x-text="c.relPath"></div>
                    <dl class="dup-stats">
                      <dt>Audio</dt>
                      <dd>
                        <template x-if="c.analysis">
                          <span class="chip" :class="{ 'chip-success': c.analysis.tier === 'high', 'chip-warning': c.analysis.tier === 'medium', 'chip-danger': c.analysis.tier === 'low' || c.analysis.tier === 'none' }"
                                x-text="c.analysis.tier === 'none' ? 'No audio' : c.analysis.kbps + ' kbps'"></span>
                        </template>
                        <span x-text="c.numAudioFiles + ' file' + (c.numAudioFiles === 1 ? '' : 's') + ' · ' + c.codecs.join(', ')"></span>
                      </dd>
                      <dt>Length</dt><dd x-text="fmt.duration(c.duration)"></dd>
                      <dt>Size</dt><dd x-text="fmt.size(c.size)"></dd>
                      <dt>Chapters</dt><dd x-text="c.numChapters"></dd>
                    </dl>
                    <template x-if="c.analysis">
                      <ul class="dup-notes">
                        <template x-for="(n, idx) in c.analysis.notes" :key="idx">
                          <li :class="'dup-note-' + n.kind">
                            <i class="bi" :class="{ 'bi-check-circle-fill': n.kind === 'good', 'bi-x-circle-fill': n.kind === 'bad', 'bi-info-circle': n.kind === 'info' }"></i>
                            <span x-text="n.text"></span>
                          </li>
                        </template>
                      </ul>
                    </template>
                    <a class="small d-inline-block mt-1" :href="`#/item/${c.id}`" @click.stop>Open book</a>
                  </label>
                </template>
              </div>
            </div>
          </div>
        </template>

        <!-- resolve dialog -->
        <template x-if="resolving">
          <div class="ui-modal">
            <div class="backdrop" @click="!resolving.busy && (resolving = null)"></div>
            <div class="modal-content">
              <div class="modal-header">
                <h2 class="h5 m-0">Resolve duplicates</h2>
                <button type="button" class="btn-close" data-dismiss aria-label="Close" @click="!resolving.busy && (resolving = null)"></button>
              </div>
              <div class="modal-body">
                <div class="mb-3"><span class="text-muted">Keeping</span> <span class="mono" x-text="(resolving.keep.folderPath || resolving.keep.libraryName) + '/' + resolving.keep.relPath"></span></div>
                <template x-for="d in resolving.discards" :key="d.copy.id">
                  <div class="panel mb-3">
                    <div class="panel-head">
                      <div class="min-w-0"><span class="text-muted">Discarding</span> <span class="mono" x-text="(d.copy.folderPath || d.copy.libraryName) + '/' + d.copy.relPath"></span></div>
                      <span class="small text-muted text-nowrap" x-text="selectedCount(d) + ' file(s) to bring over'"></span>
                    </div>
                    <div class="panel-body p-0">
                      <template x-if="!d.cmp.canCopy"><div class="p-3 status-conflict small" x-text="d.cmp.reason"></div></template>
                      <div class="table-responsive" style="max-height:40vh">
                        <table class="table table-dark-ui">
                          <thead><tr><th style="width:40px">Bring</th><th>File</th><th>Status</th><th class="text-end">Here</th><th class="text-end">Kept copy</th></tr></thead>
                          <tbody>
                            <template x-for="f in d.files" :key="f.relPath">
                              <tr>
                                <td><input class="form-check-input" type="checkbox" x-model="f.selected" :disabled="!d.cmp.canCopy || f.status === 'same' || f.blocked" :aria-label="'Bring ' + f.relPath"></td>
                                <td>
                                  <span class="mono small" x-text="f.relPath"></span> <span class="chip ms-1" x-text="f.fileType"></span>
                                  <div class="small" style="color:var(--warning)" x-show="f.warning"><i class="bi bi-exclamation-triangle"></i> <span x-text="f.warning"></span></div>
                                </td>
                                <td class="small" :class="{ 'status-ok': f.status === 'missing' || f.status === 'larger', 'status-unchanged': f.status === 'same' || f.status === 'smaller' }"
                                    x-text="statusLabel(f.status) + (f.selected && f.status !== 'missing' ? ' (replace)' : '')"></td>
                                <td class="text-end small" x-text="fmt.size(f.size)"></td>
                                <td class="text-end small text-muted" x-text="f.keepSize === null ? '—' : fmt.size(f.keepSize)"></td>
                              </tr>
                            </template>
                          </tbody>
                        </table>
                      </div>
                      <div class="p-3 small text-muted" x-show="d.files.some(f => f.fileType === 'audio' && f.selected)">
                        <i class="bi bi-exclamation-triangle" style="color:var(--warning)"></i> Audio files are being brought over. Only do this if the kept copy is missing tracks.
                      </div>
                    </div>
                  </div>
                </template>
